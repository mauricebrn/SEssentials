  self: <prefix><red>Das geht nicht mit dem Clan-Leiter.
  invalid-name: '<prefix><red>Clan-Namen: <min>–<max> Zeichen, nur Buchstaben, Zahlen und _.'
  name-taken: <prefix><red>Den Clan <white><name></white> gibt es schon.
  invalid-color: '<prefix><red>Ungültige Farbe. Erlaubt: <white><colors>'
  unknown-clan: <prefix><red>Clan <white><name></white> nicht gefunden.
  player-not-found: <prefix><red><target> ist nicht online.
