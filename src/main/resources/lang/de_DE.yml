# ============================================================
#  SEssentials – Texte: Deutsch (de_DE)
#  Aktiv mit language: de_DE in der config.yml. Fehlende Texte werden beim Start ergänzt.
#  Alle Texte unterstützen MiniMessage (https://webui.advntr.dev/) und &-Farbcodes.
#  <prefix> = Prefix aus der config.yml; allgemeine Platzhalter stehen dort im Kopf.
# ============================================================

# ------------------------------------------------------------
# Softrestart
# ------------------------------------------------------------
softrestart:
  bossbar:
    text: <red>Server-Neustart in <white><time></white>
  started: <prefix><green>Softrestart geplant in <white><time></white>.
  announce: <prefix><red>Der Server startet in <white><time></white> neu!
  title: <red><bold>Neustart
  subtitle: <gray>in <white><time></white>
  cancelled: <prefix><green>Der geplante Neustart wurde abgebrochen.
  already-running: <prefix><red>Es läuft bereits ein Softrestart (noch <time>). Nutze /softrestart cancel.
  not-running: <prefix><red>Es ist kein Softrestart geplant.
  status: <prefix><gray>Neustart in <white><time></white>.
  saving: <prefix><yellow>Server wird gespeichert und neu gestartet...
  kick: <red><bold>Server-Neustart</bold></red><newline><newline><gray>Der Server startet gerade neu.<newline>Bitte verbinde dich in ein paar Minuten erneut.
  time-format:
    minutes: <m> Minute(n)
    minutes-seconds: <m>:<ss> Minuten
    seconds: <s> Sekunde(n)
# ------------------------------------------------------------
# Vanish (/vanish, Alias /v)
# Versteckte Spieler sind für alle ohne sess.vanish.see unsichtbar (Welt, TAB, Commands,
# Serverliste, <online>). Sie können nicht chatten, bauen, abbauen, schlagen oder einsammeln.
# Beim Ein-/Ausblenden wird eine Fake-Leave/Join-Nachricht (Texte aus join-quit) gesendet.
# ------------------------------------------------------------
vanish:
  enabled: <prefix><gray>Du bist jetzt <green>unsichtbar</green>.
  disabled: <prefix><gray>Du bist jetzt wieder <red>sichtbar</red>.
  join-vanished: <prefix><gray>Du bist <green>unsichtbar</green> beigetreten.
  cooldown: <prefix><gray>Keine Fake-Nachricht gesendet (Cooldown).
  blocked: <red>Im Vanish nicht möglich.
  bypass-on: <prefix><gray>Schutz-Bypass <green>aktiv</green> – du kannst chatten, bauen, abbauen, schlagen und einsammeln.
  bypass-off: <prefix><gray>Schutz-Bypass <red>aus</red>.
  staff-join: <prefix><gray><player> ist unsichtbar beigetreten.
  staff-quit: <prefix><gray><player> hat den Server unsichtbar verlassen.
# ------------------------------------------------------------
# /fly, /heal, /feed, /god  (optional mit <spieler>)
# ------------------------------------------------------------
player-commands:
  fly-on: <prefix><gray>Flugmodus <green>aktiviert</green>.
  fly-off: <prefix><gray>Flugmodus <red>deaktiviert</red>.
  heal: <prefix><gray>Du wurdest <green>geheilt</green>.
  feed: <prefix><gray>Dein Hunger wurde <green>gestillt</green>.
  god-on: <prefix><gray>God-Modus <green>aktiviert</green>.
  god-off: <prefix><gray>God-Modus <red>deaktiviert</red>.
  # an den Ausführenden, wenn er den Befehl für einen anderen Spieler nutzt
  other: <prefix><gray>/<command> für <white><player></white> ausgeführt.
  player-only: <prefix><red>Nur für Spieler – nutze /<command> <spieler>.
command-aliases:
  missing-argument: <prefix><red>Für /<alias> fehlen Angaben.
  unsafe-argument: '<prefix><red>/<alias> erlaubt nur einfache Angaben (Buchstaben, Zahlen, _ . : -).'
  removed: <prefix><red>/<alias> gibt es nicht mehr.
  nested: <prefix><red>/<alias> ruft einen anderen Alias auf und wird deshalb nicht ausgeführt.
# ------------------------------------------------------------
# /sudo <spieler> <befehl> bzw. /sudo <spieler> c:<text> (Recht sess.sudo)
# Läuft wie eine echte Eingabe des Spielers: mit seinen Rechten, Mute-Sperren und Chatformat.
# Auch Selektoren (@a, @p) und Fake-Spieler gehen. Spieler mit sess.sudo.exempt steuert nur die Konsole.
# Platzhalter: <target>, <input>
# ------------------------------------------------------------
sudo:
  executed: '<prefix><gray><white><target></white> führt aus: <white><input>'
  chatted: '<prefix><gray><white><target></white> schreibt: <white><input>'
  exempt: <prefix><red><white><target></white> kann nicht per /sudo gesteuert werden.
  empty: <prefix><red>Gib einen Befehl oder c:<text> an.
# ------------------------------------------------------------
# /nether und /end – im Nether/End führt derselbe Befehl zurück in die Oberwelt
# ------------------------------------------------------------
dimensions:
  nether: <prefix><gray>Willkommen im <red>Nether</red>.
  end: <prefix><gray>Willkommen im <light_purple>End</light_purple>.
  overworld: <prefix><gray>Zurück in der <green>Oberwelt</green>.
  world-missing: <prefix><red>Diese Dimension ist auf dem Server nicht aktiviert.
# ------------------------------------------------------------
# Hilfe (/help, Alias /?) – ersetzt die Vanilla-Hilfe durch ein Menü. Die Konsole bekommt sie als Text.
# Kategorien erscheinen als Kacheln, darin die Befehle. Pro Befehl:
#   command: der Befehl            name / description: Anzeige (MiniMessage)     icon: Item, z.B. ENDER_PEARL
#   click: run = beim Klick ausführen, suggest = zum Ergänzen in den Chat schreiben (Standard),
#          url = Link anzeigen (dazu url: "https://…"), none = nur Info
#   permission: nur mit diesem Recht sichtbar (auch für ganze Kategorien)
# Kategorien oder Einträge ohne sichtbaren Befehl werden ausgeblendet.
# ------------------------------------------------------------
help:
  title: <dark_gray>Hilfe
  empty: <prefix><gray>Keine Hilfe verfügbar.
  suggest: '<prefix><gray>Klicke hier: <click:suggest_command:''<command>''><hover:show_text:''<gray>In den Chat übernehmen''><gold><command></gold></hover></click>'
  link: '<prefix><gray>Link: <click:open_url:''<url>''><aqua><u><url></u></aqua></click>'
  text-entry: <gray> <name> <dark_gray>–</dark_gray> <description>
# ------------------------------------------------------------
# Teleport-Wartezeit für /spawn, /tpa (der Anfragende nach Annahme), /nether, /end und /clan home.
# Der Teleport startet erst, wenn man so lange stillsteht und keinen Schaden nimmt. Kosten werden erst
# beim Teleport abgezogen – ein Abbruch kostet nichts. Mit sess.teleport.nowarmup sofort.
# Admin-Teleports (Admin-Panel, Reports) und Join/Respawn sind nie betroffen.
# ------------------------------------------------------------
teleport-warmup:
  started: <prefix><gray>Teleport in <white><seconds></white> Sekunden – nicht bewegen und keinen Schaden nehmen.
  countdown: <yellow>Teleport in <white><seconds></white>…
  cancelled-move: <prefix><red>Teleport abgebrochen – du hast dich bewegt.
  cancelled-damage: <prefix><red>Teleport abgebrochen – du hast Schaden genommen.
# ------------------------------------------------------------
# Spawn (/spawn, /setspawn)
# Mit sess.spawn ist /spawn kostenlos, sonst kostet es den Betrag unten (Konto oder Items).
# Platzhalter in den Kosten-Texten: <price>, <amount>, <item>
# Neue Spieler und Respawns ohne Bett/Anker landen exakt am gesetzten Spawn.
# ------------------------------------------------------------
spawn:
  set: <prefix><green>Spawn auf deine Position gesetzt.
  teleported: <prefix><gray>Du wurdest zum <green>Spawn</green> teleportiert.
  teleported-paid: <prefix><gray>Du wurdest zum <green>Spawn</green> teleportiert. <dark_gray>(-<price>)
  not-enough: <prefix><red>Du brauchst <white><price></white>, um dich zum Spawn zu teleportieren.
  failed: <prefix><red>Teleport fehlgeschlagen.
# ------------------------------------------------------------
# Bank (/bank, /balance, /pay, /baltop, /eco)
# Spieler zahlen Items auf ein digitales Konto ein und bezahlen damit Befehle, andere Spieler
# und – mit Vault – andere Plugins (Shops usw.). Beträge sind ganze Einheiten.
# Platzhalter: <amount>, <balance>, <target>, <sender>, <rank>, <name>
# ------------------------------------------------------------
bank:
  balance: '<prefix><gray>Kontostand: <gold><balance>'
  balance-other: '<prefix><gray>Kontostand von <white><target></white>: <gold><balance>'
  deposited: '<prefix><green>+<amount></green> <gray>eingezahlt. Kontostand: <gold><balance>'
  nothing-to-deposit: <prefix><red>Du hast nichts Einzahlbares im Inventar.
  nothing-in-hand: <prefix><red>Das Item in deiner Hand kann nicht eingezahlt werden.
  withdrawn: '<prefix><gray><amount> ausgezahlt. Kontostand: <gold><balance>'
  withdrawn-partial: '<prefix><gray><amount> ausgezahlt – der Rest ist kleiner als die kleinste Einheit und bleibt auf dem Konto. Kontostand: <gold><balance>'
  withdraw-disabled: <prefix><red>Auszahlen ist auf diesem Server deaktiviert.
  withdraw-too-small: <prefix><red>Der kleinste auszahlbare Betrag ist <amount>.
  not-enough: <prefix><red>Dein Kontostand reicht nicht für <amount> (<balance>).
  paid: <prefix><gray>Du hast <white><target></white> <gold><amount></gold> überwiesen.
  received: <prefix><white><sender></white> <gray>hat dir <gold><amount></gold> überwiesen.
  pay-self: <prefix><red>Du kannst dir nicht selbst Geld überweisen.
  unknown-player: <prefix><red>Der Spieler <white><target></white> war noch nie auf dem Server.
  invalid-amount: <prefix><red>Ungültiger Betrag.
  cancelled: <prefix><gray>Eingabe abgebrochen.
  prompt-withdraw: <prefix><gray>Wie viel möchtest du auszahlen? Betrag im Chat eingeben. <click:suggest_command:'abbrechen'><red>[Abbrechen]</red></click>
  prompt-admin: '<prefix><gray>Kontostand von <white><target></white> ändern: <white>+100</white>, <white>-50</white> oder <white>=200</white>. <click:suggest_command:''abbrechen''><red>[Abbrechen]</red></click>'
  admin-updated: '<prefix><gray>Kontostand von <white><target></white>: <gold><balance>'
  baltop-header: <dark_gray>────── <gold><bold>Reichste Spieler</bold></gold> ──────
  baltop-entry: <gray><rank>. <white><name></white> <dark_gray>»</dark_gray> <gold><balance>
# ------------------------------------------------------------
# /enderchest (Alias /ec) – öffnet die eigene Enderchest. Mit sess.enderchest.free kostenlos.
# Platzhalter: <price> (z.B. "50 Taler" oder "1x Diamant"), <amount>, <item>
# ------------------------------------------------------------
enderchest:
  opened-paid: <prefix><gray>Enderchest geöffnet. <dark_gray>(-<price>)
  not-enough: <prefix><red>Du brauchst <white><price></white>, um deine Enderchest zu öffnen.
# ------------------------------------------------------------
# Glücksrad (/gluecksrad, Alias /gamble)
# Einsatz in Bank-Währung einstellen und drehen. Einsätze, die Gebühr unten und alle Zahlungen an den
# Server (Kosten von /tpa, /spawn, /ec, Käufe in Admin-Shops; Item-Kosten mit ihrem Bank-Kurs) fließen
# in den Topf; Gewinne werden aus dem Topf bezahlt. Gedreht werden kann nur, wenn der Topf den höchsten
# möglichen Gewinn deckt. Topf ansehen: /gluecksrad topf, setzen: /gluecksrad topf setzen <betrag>
# oder im Admin-Panel (Wirtschaft → Glücksrad, Recht sess.gamble.admin)
# Platzhalter: <amount>, <stake>, <multiplier>, <pot>, <price>, <winner> (nur jackpot-broadcast)
# ------------------------------------------------------------
gambling:
  won: <prefix><green>Das Rad bleibt auf <white><multiplier></white> stehen – du bekommst <gold><amount></gold>. <dark_gray>(Einsatz <stake>)
  jackpot: '<prefix><light_purple><bold>JACKPOT!</bold></light_purple> <green>Du gewinnst den ganzen Topf: <gold><amount></gold>.'
  jackpot-broadcast: '<prefix><light_purple><bold>JACKPOT!</bold></light_purple> <white><winner></white> <gray>hat am Glücksrad den ganzen Topf gewonnen: <gold><amount></gold>!'
  lost: <prefix><red>Das Rad bleibt auf <white><multiplier></white> stehen – leider verloren. <dark_gray>(Einsatz <stake>)
  not-enough: <prefix><red>Dein Kontostand reicht nicht für den Einsatz von <amount>.
  not-enough-fee: <prefix><red>Du brauchst <white><price></white> als Gebühr.
  pot-too-small: '<prefix><red>Der Topf (<pot>) kann den möglichen Gewinn nicht decken. Höchster Einsatz gerade: <white><amount></white>.'
  disabled: <prefix><red>Das Glücksrad ist nicht eingerichtet.
  prompt-stake: <prefix><gray>Wie viel möchtest du setzen? Betrag im Chat eingeben. <click:suggest_command:'abbrechen'><red>[Abbrechen]</red></click>
  invalid-amount: <prefix><red>Ungültiger Betrag.
  cancelled: <prefix><gray>Eingabe abgebrochen.
  pot: '<prefix><gray>Im Topf des Glücksrads: <gold><pot>'
  pot-set: <prefix><gray>Topf auf <gold><pot></gold> gesetzt.
  prompt-pot: '<prefix><gray>Topf ändern (aktuell <gold><pot></gold>): <white>+100</white>, <white>-50</white> oder <white>=200</white>. <click:suggest_command:''abbrechen''><red>[Abbrechen]</red></click>'
# ------------------------------------------------------------
# Chestshops – Schild an eine Kiste/ein Fass (Wandschild oder obendrauf):
#   Zeile 1: [Shop]        (Admin-Shop mit unbegrenztem Bestand: [AdminShop], Recht sess.chestshop.admin)
#   Zeile 2: Menge pro Handel, z.B. 16
#   Zeile 3: Preise in Talern: K 100 (Spieler kauft) und/oder V 80 (Spieler verkauft)
#   Zeile 4: leer = erstes Item in der Kiste (sonst Item in der Hand) oder Item-Name, z.B. DIAMOND
# Gebühren-Shop (bezahlen ohne Item, z.B. für eine Farm; keine Kiste nötig):
#   [Shop] / Beschreibung (z.B. Farm) / K 50 / Gebühr   (statt "Gebühr" auch Eintritt, Nutzung, Fee oder -)
# Oder per Menü: /shop, während man auf die Kiste (bzw. einen Block für Gebühren) schaut.
# Rechtsklick aufs Schild = kaufen bzw. Gebühr zahlen, Linksklick = verkaufen. Besitzer bauen mit Sneak + Linksklick ab.
# Platzhalter: <owner>, <amount>, <item>, <buy>, <sell>, <stock>, <price>, <customer>
# ------------------------------------------------------------
chestshop:
  created: '<prefix><green>Shop erstellt: <white><amount>x <item></white> – Kaufen <gold><buy></gold>, Verkaufen <gold><sell></gold>.'
  created-admin: '<prefix><green>Admin-Shop erstellt: <white><amount>x <item></white> – Kaufen <gold><buy></gold>, Verkaufen <gold><sell></gold>.'
  no-permission: <prefix><red>Du darfst diesen Shop-Typ nicht erstellen.
  no-container: <prefix><red>Das Schild muss an einer Kiste oder einem Fass hängen bzw. darauf stehen.
  container-taken: <prefix><red>Diese Kiste gehört schon zum Shop von <white><owner></white>.
  invalid-amount: '<prefix><red>Zeile 2: Menge zwischen 1 und 2304 angeben.'
  invalid-price: '<prefix><red>Zeile 3: Preis angeben, z.B. <white>K 100</white>, <white>V 80</white> oder <white>K 100 V 80</white>.'
  no-item: '<prefix><red>Zeile 4: unbekanntes Item – oder leer lassen und das Item in die Kiste bzw. in die Hand nehmen.'
  bought: <prefix><gray>Du hast <white><amount>x <item></white> für <gold><price></gold> gekauft.
  sold: <prefix><gray>Du hast <white><amount>x <item></white> für <gold><price></gold> verkauft.
  owner-bought: <prefix><white><customer></white> <gray>hat <white><amount>x <item></white> für <gold><price></gold> in deinem Shop gekauft.
  owner-sold: <prefix><white><customer></white> <gray>hat dir <white><amount>x <item></white> für <gold><price></gold> verkauft.
  no-buy: <prefix><red>Dieser Shop verkauft nichts.
  no-sell: <prefix><red>Dieser Shop kauft nichts an.
  out-of-stock: <prefix><red>Der Shop ist ausverkauft.
  shop-full: <prefix><red>Die Kiste des Shops ist voll.
  inventory-full: <prefix><red>Dein Inventar ist zu voll.
  not-enough-money: <prefix><red>Du brauchst <gold><price></gold>.
  owner-not-enough-money: <prefix><red>Der Besitzer kann <gold><price></gold> gerade nicht bezahlen.
  not-enough-items: <prefix><red>Du hast keine <white><amount>x <item></white>.
  info: '<prefix><gray>Shop von <white><owner></white>: <white><amount>x <item></white> – Kaufen <gold><buy></gold>, Verkaufen <gold><sell></gold>, Bestand <white><stock></white>.'
  owner-hint: '<prefix><dark_gray>Zum Abbauen: Sneak + Linksklick.'
  protected: <prefix><red>Diese Kiste gehört zum Shop von <white><owner></white>.
  removed: <prefix><gray>Shop entfernt.
  created-fee: '<prefix><green>Gebühren-Shop erstellt: <white><item></white> für <gold><price></gold>.'
  invalid-fee-price: '<prefix><red>Zeile 3: Gebühr angeben, z.B. <white>K 50</white>.'
  fee-paid: <prefix><gray>Du hast <gold><price></gold> an <white><owner></white> gezahlt <dark_gray>(<item>)</dark_gray>.
  owner-fee-paid: <prefix><white><customer></white> <gray>hat <gold><price></gold> gezahlt <dark_gray>(<item>)</dark_gray>.
  creator-look-at-block: <prefix><red>Schau auf eine Kiste oder ein Fass (für einen Gebühren-Shop auf einen beliebigen Block), höchstens 5 Blöcke entfernt.
  creator-sign-blocked: <prefix><red>An dieser Seite ist kein Platz für ein Schild.
  creator-no-sign: <prefix><red>Du brauchst ein Schild im Inventar.
  creator-place-denied: <prefix><red>Hier darfst du kein Schild platzieren.
  creator-prompt-amount: <prefix><gray>Menge pro Handel im Chat eingeben. <click:suggest_command:'abbrechen'><red>[Abbrechen]</red></click>
  creator-prompt-price: <prefix><gray>Preis in Talern im Chat eingeben. <click:suggest_command:'abbrechen'><red>[Abbrechen]</red></click>
  creator-prompt-label: <prefix><gray>Beschreibung im Chat eingeben (max. 15 Zeichen), z.B. <white>Farm</white>. <click:suggest_command:'abbrechen'><red>[Abbrechen]</red></click>
  creator-invalid-number: <prefix><red>Ungültige Zahl.
  fee-info: '<prefix><gray>Gebühr von <white><owner></white>: <white><item></white> – <gold><price></gold>. Rechtsklick zum Bezahlen.'
# ------------------------------------------------------------
# Private Nachrichten: /msg (auch /tell, /w, /whisper) und /r (/reply) für die letzte Konversation
# Platzhalter: <sender>, <target>, <message> (immer reiner Text)
# ------------------------------------------------------------
msg:
  sent: <dark_gray>[<gray>Du</gray> <dark_gray>→</dark_gray> <click:suggest_command:'/msg <target> '><white><target></white></click>]</dark_gray> <gray><message>
  received: <dark_gray>[<click:suggest_command:'/msg <sender> '><white><sender></white></click> <dark_gray>→</dark_gray> <gray>Dir</gray>]</dark_gray> <gray><message>
  not-online: <prefix><red><target> ist nicht online.
  self: <prefix><red>Du kannst dir nicht selbst schreiben.
  no-partner: <prefix><red>Du hast noch mit niemandem geschrieben.
  partner-offline: <prefix><red>Dein Gesprächspartner ist nicht mehr online.
# ------------------------------------------------------------
# Spy (/socialspy, Alias /spy – Recht sess.spy): private Nachrichten (/msg, /r) und Mails mitlesen.
# Standardmäßig aus; an/aus mit /socialspy oder im Admin-Panel unter "Benachrichtigungen".
# Absender und Empfänger bekommen keine Kopie. Platzhalter: <sender>, <target>, <message> (reiner Text)
# ------------------------------------------------------------
spy:
  msg: <dark_gray>[<light_purple>Spy</light_purple>] <gray><sender> <dark_gray>→</dark_gray> <target>:</gray> <white><message>
  mail: <dark_gray>[<light_purple>Spy</light_purple>] <gray>Mail <sender> <dark_gray>→</dark_gray> <target>:</gray> <white><message>
  enabled: <prefix><gray>Spy <green>eingeschaltet</green> – du siehst private Nachrichten und Mails.
  disabled: <prefix><gray>Spy <red>ausgeschaltet</red>.
# ------------------------------------------------------------
# Mail (/mail send <spieler> <nachricht>, /mail [read], /mail delete <nr>, /mail clear)
# Nachrichten an Spieler, die schon einmal auf dem Server waren – auch wenn sie offline sind.
# Beim Join erfährt der Empfänger von ungelesenen Mails. Gemutete Spieler können keine Mails senden.
# Platzhalter: <sender>, <target>, <message> (immer reiner Text), <count>, <number>, <time>, <max>
# ------------------------------------------------------------
mail:
  sent: '<prefix><gray>Mail an <white><target></white> gesendet: <gray><message>'
  new: <prefix><gray>Neue Mail von <white><sender></white>. <click:run_command:'/mail read'><hover:show_text:'<gray>Mails lesen'><green>[Lesen]</green></hover></click>
  unread: <prefix><gray>Du hast <white><count></white> ungelesene Mail(s). <click:run_command:'/mail read'><hover:show_text:'<gray>Mails lesen'><green>[Lesen]</green></hover></click>
  header: <dark_gray>────── <gold><bold>Mails</bold></gold> <gray>(<count>)</gray> ──────
  entry: <dark_gray><number>. <gray><time></gray> <white><sender></white><dark_gray>:</dark_gray> <gray><message>
  entry-unread: <yellow><number>. <gray><time></gray> <white><sender></white><dark_gray>:</dark_gray> <white><message>
  footer: '<dark_gray>Antworten: <gray>/mail send <spieler> …</gray> · Löschen: <click:suggest_command:''/mail delete ''><gray>/mail delete <nr></gray></click> · <click:run_command:''/mail clear''><red>[Alle löschen]</red></click>'
  empty: <prefix><gray>Du hast keine Mails.
  deleted: <prefix><gray>Mail <white><number></white> gelöscht.
  cleared: <prefix><gray>Alle Mails gelöscht.
  no-such-mail: <prefix><red>Es gibt keine Mail Nummer <number>.
  unknown-player: <prefix><red>Der Spieler <white><target></white> war noch nie auf dem Server.
  self: <prefix><red>Du kannst dir nicht selbst eine Mail schreiben.
  too-long: <prefix><red>Die Mail ist zu lang (höchstens <max> Zeichen).
  inbox-full: <prefix><red>Das Postfach von <white><target></white> ist voll.
  muted: <prefix><red>Du bist gemutet und kannst keine Mails senden.
# ------------------------------------------------------------
# Teleport-Anfragen (/tpa <spieler>, /tpaccept [spieler], /tpdeny [spieler])
# Der Anfragende zahlt erst, wenn die Anfrage angenommen wird. Mit sess.tpa.free kostenlos.
# Platzhalter: <requester>, <target>, <seconds>, <price> (z.B. "500 Taler" oder "5x Diamant"), <amount>, <item>
# ------------------------------------------------------------
tpa:
  sent: <prefix><gray>Anfrage an <white><target></white> gesendet. Sie verfällt in <seconds> Sekunden.
  sent-paid: '<prefix><gray>Anfrage an <white><target></white> gesendet. <dark_gray>(Kosten bei Annahme: <price>)'
  received: <prefix><white><requester></white><gray> möchte sich zu dir teleportieren. <click:run_command:'/tpaccept <requester>'><hover:show_text:'<green>Annehmen'><green>[Annehmen]</green></hover></click> <click:run_command:'/tpdeny <requester>'><hover:show_text:'<red>Ablehnen'><red>[Ablehnen]</red></hover></click>
  accepted: <prefix><green><target> hat deine Anfrage angenommen.
  accepted-paid: <prefix><green><target> hat deine Anfrage angenommen. <dark_gray>(-<price>)
  accepted-target: <prefix><green>Anfrage von <white><requester></white> angenommen.
  denied: <prefix><red><target> hat deine Anfrage abgelehnt.
  denied-target: <prefix><gray>Anfrage von <white><requester></white> abgelehnt.
  no-request: <prefix><red>Keine offene Teleport-Anfrage.
  not-found: <prefix><red><target> ist nicht online.
  self: <prefix><red>Du kannst dir selbst keine Anfrage schicken.
  not-enough: <prefix><red>Du brauchst <white><price></white> für eine Teleport-Anfrage.
  requester-cannot-pay: <prefix><red><requester> kann <price> nicht mehr bezahlen – Teleport abgebrochen.
  failed: <prefix><red>Teleport fehlgeschlagen.
# ------------------------------------------------------------
# Kopfgeld (/kopfgeld <spieler> <betrag>, /kopfgeld zeigt die höchsten; Alias /bounty)
# Der Betrag wird sofort vom Bankkonto abgebucht. Wer das Ziel tötet, bekommt alle Kopfgelder,
# die er nicht selbst ausgesetzt hat, plus das Inventar des Opfers. Gespeichert in bounties.yml.
# Admins (sess.bounty.admin) verwalten Kopfgelder im Admin-Panel oder mit /kopfgeld entfernen <spieler>.
# Entfernte und abgelaufene Kopfgelder gehen an den Aussetzenden zurück.
# Platzhalter: <setter>, <killer>, <target>, <amount>, <total>, <rank>, <duration>
# ------------------------------------------------------------
bounty:
  placed: '<prefix><green>Kopfgeld von <white><amount></white> auf <white><target></white> ausgesetzt. <dark_gray>(Gesamt: <total>, gilt: <duration>)'
  placed-broadcast: '<prefix><white><setter></white><gray> hat <gold><amount></gold> Kopfgeld auf <white><target></white> ausgesetzt. <dark_gray>(Gesamt: <total>)'
  claimed: <prefix><green>Du hast <white><target></white> erledigt und <gold><amount></gold> Kopfgeld samt Inventar kassiert!
  claimed-broadcast: <prefix><white><killer></white><gray> hat das Kopfgeld von <gold><amount></gold> auf <white><target></white> kassiert.
  not-enough: <prefix><red>Du hast keine <white><amount></white> auf dem Konto.
  self: <prefix><red>Du kannst kein Kopfgeld auf dich selbst aussetzen.
  unknown-player: <prefix><red>Spieler <white><target></white> nicht gefunden.
  list-header: <dark_gray>────── <gold><bold>☠ Kopfgelder</bold></gold> <dark_gray>──────
  list-entry: <gray> <rank>. <white><target></white> <dark_gray>–</dark_gray> <gold><total>
  list-empty: <prefix><gray>Zurzeit ist kein Kopfgeld ausgesetzt.
  expired: <prefix><gray>Dein Kopfgeld auf <white><target></white> ist abgelaufen. <white><amount></white> wurden zurückerstattet.
  removed: <prefix><gray>Dein Kopfgeld auf <white><target></white> wurde von einem Admin entfernt. <white><amount></white> wurden zurückerstattet.
  admin-removed: <prefix><green>Kopfgeld von <white><amount></white> auf <white><target></white> entfernt und erstattet.
  none: <prefix><red>Auf <white><target></white> ist kein Kopfgeld ausgesetzt.
# ------------------------------------------------------------
# Clans (/clan) – Kosten-Format wie bei spawn.cost (type money = Bankkonto, item = Items, amount 0 = kostenlos).
