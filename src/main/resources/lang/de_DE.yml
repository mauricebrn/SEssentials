  chest-picked-up: <prefix><gray>Clan-Truhe abgebaut – der Inhalt bleibt erhalten.
  chest-foreign: <prefix><red>Diese Truhe gehört dem Clan <clan>.
  chest-not-placed: <prefix><red>Eure Clan-Truhe ist nicht aufgestellt.
