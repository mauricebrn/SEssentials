  vote-running: <prefix><red>Es läuft schon eine Abstimmung (<yes> Ja / <no> Nein).
  no-vote: <prefix><red>Zurzeit läuft keine Home-Abstimmung.
  voted-yes: <prefix><green>Du stimmst dafür. <gray>(<yes> Ja / <no> Nein von <count>)
  voted-no: <prefix><red>Du stimmst dagegen. <gray>(<yes> Ja / <no> Nein von <count>)
  home-set: '<prefix><green>Abgestimmt: Das Clan-Home ist jetzt bei <white><location></white>.'
  vote-failed: <prefix><red>Abstimmung über das Home bei <location> gescheitert.
  vote-expired: <prefix><gray>Die Home-Abstimmung ist abgelaufen.
  chest-bought: <prefix><green><target> hat die Clan-Truhe für <amount> vom Clan-Konto gekauft.
  chest-given: <prefix><gray>Stelle die Clan-Truhe höchstens <white><distance></white> Blöcke vom Clan-Home entfernt auf.
  chest-not-bought: <prefix><red>Euer Clan hat noch keine Truhe gekauft.
