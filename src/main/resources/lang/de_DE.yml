  color-changed: '<prefix><gray>Die Clan-Farbe ist jetzt: <clan>'
  invite-sent: <prefix><gray>Einladung an <white><target></white> gesendet. Sie verfällt in <seconds> Sekunden.
  invited: <prefix><white><inviter></white><gray> lädt dich in den Clan <clan> ein. <click:run_command:'/clan annehmen <clan_name>'><hover:show_text:'<green>Beitreten'><green>[Annehmen]</green></hover></click> <click:run_command:'/clan ablehnen <clan_name>'><hover:show_text:'<red>Ablehnen'><red>[Ablehnen]</red></hover></click>
  invite-not-found: <prefix><red>Keine offene Clan-Einladung.
  target-in-clan: <prefix><red><target> ist schon in einem Clan.
  clan-full: <prefix><red>Der Clan <clan> ist voll.
  joined: <prefix><green><target> ist dem Clan <clan> beigetreten.
  declined: <prefix><gray>Einladung von <clan> abgelehnt.
