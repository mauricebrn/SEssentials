  new-leader: <prefix><gold><target> ist jetzt Leiter von <clan>.
  disband-confirm: <prefix><red>Clan wirklich auflösen? Das Clan-Konto geht an dich, die Truhe muss leer sein. <click:run_command:'/clan aufloesen bestaetigen'><hover:show_text:'<red>Endgültig auflösen'><dark_red>[Bestätigen]</dark_red></hover></click>
  disbanded: <prefix><red>Der Clan <clan> wurde aufgelöst. <gray>Clan-Konto (<amount>) ging an den Leiter.
  admin-disbanded: <prefix><green>Clan <clan> aufgelöst.
  chest-not-empty: <prefix><red>Leere zuerst die Clan-Truhe.
  info: '<dark_gray>────── <clan> <dark_gray>──────<newline><gray>Leiter: <white><leader><newline><gray>Mitglieder (<count>): <white><members><newline><gray>Clan-Konto: <gold><balance><newline><gray>Home: <white><home><newline><gray>Truhe: <white><chest><newline><gray>Friendly Fire: <state>'
  home-none: nicht gesetzt
  chest-state-none: nicht gekauft
  chest-state-unplaced: gekauft, nicht aufgestellt
  chest-state-placed: aufgestellt
  list-header: <dark_gray>────── <gold><bold>Clans</bold></gold> <gray>(<count>)</gray> <dark_gray>──────
  list-entry: <gray> <clan> <dark_gray>–</dark_gray> <white><count></white> Mitglieder, Leiter <white><leader>
  list-empty: <prefix><gray>Es gibt noch keine Clans.
  home-not-set: '<prefix><red>Euer Clan hat noch kein Home. <gray>Vorschlagen: <white>/clan home vorschlagen'
