# ------------------------------------------------------------
# Chestshops – Schild an eine Kiste/ein Fass (Wandschild oder obendrauf):
#   Zeile 1: [Shop]        (Admin-Shop mit unbegrenztem Bestand: [AdminShop], Recht sess.chestshop.admin)
#   Zeile 2: Menge pro Handel, z.B. 16
#   Zeile 3: Preise in Talern: K 100 (Spieler kauft) und/oder V 80 (Spieler verkauft)
#   Zeile 4: leer = erstes Item in der Kiste (sonst Item in der Hand) oder Item-Name, z.B. DIAMOND
# Gebühren-Shop (bezahlen ohne Item, z.B. für eine Farm; keine Kiste nötig):
#   [Shop] / Beschreibung (z.B. Farm) / K 50 / Gebühr   (statt "Gebühr" auch Eintritt, Nutzung, Fee oder -)
# Oder per Menü: /shop, während man auf die Kiste (bzw. einen Block für Gebühren) schaut.
# Rechtsklick aufs Schild = kaufen bzw. Gebühr zahlen, Linksklick = verkaufen. Besitzer bauen mit Sneak + Linksklick ab.
# Platzhalter: <owner>, <amount>, <item>, <buy>, <sell>, <stock>, <price>, <customer>
# ------------------------------------------------------------
chestshop:
  messages:
    created: "<prefix><green>Shop erstellt: <white><amount>x <item></white> – Kaufen <gold><buy></gold>, Verkaufen <gold><sell></gold>."
    created-admin: "<prefix><green>Admin-Shop erstellt: <white><amount>x <item></white> – Kaufen <gold><buy></gold>, Verkaufen <gold><sell></gold>."
    no-permission: "<prefix><red>Du darfst diesen Shop-Typ nicht erstellen."
    no-container: "<prefix><red>Das Schild muss an einer Kiste oder einem Fass hängen bzw. darauf stehen."
    container-taken: "<prefix><red>Diese Kiste gehört schon zum Shop von <white><owner></white>."
    invalid-amount: "<prefix><red>Zeile 2: Menge zwischen 1 und 2304 angeben."
    invalid-price: "<prefix><red>Zeile 3: Preis angeben, z.B. <white>K 100</white>, <white>V 80</white> oder <white>K 100 V 80</white>."
    no-item: "<prefix><red>Zeile 4: unbekanntes Item – oder leer lassen und das Item in die Kiste bzw. in die Hand nehmen."
    bought: "<prefix><gray>Du hast <white><amount>x <item></white> für <gold><price></gold> gekauft."
    sold: "<prefix><gray>Du hast <white><amount>x <item></white> für <gold><price></gold> verkauft."
    owner-bought: "<prefix><white><customer></white> <gray>hat <white><amount>x <item></white> für <gold><price></gold> in deinem Shop gekauft."
    owner-sold: "<prefix><white><customer></white> <gray>hat dir <white><amount>x <item></white> für <gold><price></gold> verkauft."
    no-buy: "<prefix><red>Dieser Shop verkauft nichts."
    no-sell: "<prefix><red>Dieser Shop kauft nichts an."
    out-of-stock: "<prefix><red>Der Shop ist ausverkauft."
    shop-full: "<prefix><red>Die Kiste des Shops ist voll."
    inventory-full: "<prefix><red>Dein Inventar ist zu voll."
    not-enough-money: "<prefix><red>Du brauchst <gold><price></gold>."
    owner-not-enough-money: "<prefix><red>Der Besitzer kann <gold><price></gold> gerade nicht bezahlen."
    not-enough-items: "<prefix><red>Du hast keine <white><amount>x <item></white>."
    info: "<prefix><gray>Shop von <white><owner></white>: <white><amount>x <item></white> – Kaufen <gold><buy></gold>, Verkaufen <gold><sell></gold>, Bestand <white><stock></white>."
    owner-hint: "<prefix><dark_gray>Zum Abbauen: Sneak + Linksklick."
    protected: "<prefix><red>Diese Kiste gehört zum Shop von <white><owner></white>."
    removed: "<prefix><gray>Shop entfernt."
    created-fee: "<prefix><green>Gebühren-Shop erstellt: <white><item></white> für <gold><price></gold>."
    invalid-fee-price: "<prefix><red>Zeile 3: Gebühr angeben, z.B. <white>K 50</white>."
    fee-paid: "<prefix><gray>Du hast <gold><price></gold> an <white><owner></white> gezahlt <dark_gray>(<item>)</dark_gray>."
    owner-fee-paid: "<prefix><white><customer></white> <gray>hat <gold><price></gold> gezahlt <dark_gray>(<item>)</dark_gray>."
    creator-look-at-block: "<prefix><red>Schau auf eine Kiste oder ein Fass (für einen Gebühren-Shop auf einen beliebigen Block), höchstens 5 Blöcke entfernt."
    creator-sign-blocked: "<prefix><red>An dieser Seite ist kein Platz für ein Schild."
    creator-no-sign: "<prefix><red>Du brauchst ein Schild im Inventar."
    creator-place-denied: "<prefix><red>Hier darfst du kein Schild platzieren."
    creator-prompt-amount: "<prefix><gray>Menge pro Handel im Chat eingeben. <click:suggest_command:'abbrechen'><red>[Abbrechen]</red></click>"
    creator-prompt-price: "<prefix><gray>Preis in Talern im Chat eingeben. <click:suggest_command:'abbrechen'><red>[Abbrechen]</red></click>"
    creator-prompt-label: "<prefix><gray>Beschreibung im Chat eingeben (max. 15 Zeichen), z.B. <white>Farm</white>. <click:suggest_command:'abbrechen'><red>[Abbrechen]</red></click>"
    creator-invalid-number: "<prefix><red>Ungültige Zahl."
    fee-info: "<prefix><gray>Gebühr von <white><owner></white>: <white><item></white> – <gold><price></gold>. Rechtsklick zum Bezahlen."

# ------------------------------------------------------------
# Private Nachrichten: /msg (auch /tell, /w, /whisper) und /r (/reply) für die letzte Konversation
# Platzhalter: <sender>, <target>, <message> (immer reiner Text)
# ------------------------------------------------------------
msg:
  sent: "<dark_gray>[<gray>Du</gray> <dark_gray>→</dark_gray> <click:suggest_command:'/msg <target> '><white><target></white></click>]</dark_gray> <gray><message>"
  received: "<dark_gray>[<click:suggest_command:'/msg <sender> '><white><sender></white></click> <dark_gray>→</dark_gray> <gray>Dir</gray>]</dark_gray> <gray><message>"
  not-online: "<prefix><red><target> ist nicht online."
  self: "<prefix><red>Du kannst dir nicht selbst schreiben."
  no-partner: "<prefix><red>Du hast noch mit niemandem geschrieben."
  partner-offline: "<prefix><red>Dein Gesprächspartner ist nicht mehr online."

# ------------------------------------------------------------
# Spy (/socialspy, Alias /spy – Recht sess.spy): private Nachrichten (/msg, /r) und Mails mitlesen.
# Standardmäßig aus; an/aus mit /socialspy oder im Admin-Panel unter "Benachrichtigungen".
# Absender und Empfänger bekommen keine Kopie. Platzhalter: <sender>, <target>, <message> (reiner Text)
# ------------------------------------------------------------
spy:
  messages:
    msg: "<dark_gray>[<light_purple>Spy</light_purple>] <gray><sender> <dark_gray>→</dark_gray> <target>:</gray> <white><message>"
    mail: "<dark_gray>[<light_purple>Spy</light_purple>] <gray>Mail <sender> <dark_gray>→</dark_gray> <target>:</gray> <white><message>"
    enabled: "<prefix><gray>Spy <green>eingeschaltet</green> – du siehst private Nachrichten und Mails."
    disabled: "<prefix><gray>Spy <red>ausgeschaltet</red>."

# ------------------------------------------------------------
# Mail (/mail send <spieler> <nachricht>, /mail [read], /mail delete <nr>, /mail clear)
# Nachrichten an Spieler, die schon einmal auf dem Server waren – auch wenn sie offline sind.
# Beim Join erfährt der Empfänger von ungelesenen Mails. Gemutete Spieler können keine Mails senden.
# Platzhalter: <sender>, <target>, <message> (immer reiner Text), <count>, <number>, <time>, <max>
# ------------------------------------------------------------
mail:
  max-per-inbox: 50
  max-length: 256
  messages:
    sent: "<prefix><gray>Mail an <white><target></white> gesendet: <gray><message>"
    new: "<prefix><gray>Neue Mail von <white><sender></white>. <click:run_command:'/mail read'><hover:show_text:'<gray>Mails lesen'><green>[Lesen]</green></hover></click>"
    unread: "<prefix><gray>Du hast <white><count></white> ungelesene Mail(s). <click:run_command:'/mail read'><hover:show_text:'<gray>Mails lesen'><green>[Lesen]</green></hover></click>"
    header: "<dark_gray>────── <gold><bold>Mails</bold></gold> <gray>(<count>)</gray> ──────"
    entry: "<dark_gray><number>. <gray><time></gray> <white><sender></white><dark_gray>:</dark_gray> <gray><message>"
    entry-unread: "<yellow><number>. <gray><time></gray> <white><sender></white><dark_gray>:</dark_gray> <white><message>"
    footer: "<dark_gray>Antworten: <gray>/mail send <spieler> …</gray> · Löschen: <click:suggest_command:'/mail delete '><gray>/mail delete <nr></gray></click> · <click:run_command:'/mail clear'><red>[Alle löschen]</red></click>"
    empty: "<prefix><gray>Du hast keine Mails."
    deleted: "<prefix><gray>Mail <white><number></white> gelöscht."
    cleared: "<prefix><gray>Alle Mails gelöscht."
    no-such-mail: "<prefix><red>Es gibt keine Mail Nummer <number>."
    unknown-player: "<prefix><red>Der Spieler <white><target></white> war noch nie auf dem Server."
    self: "<prefix><red>Du kannst dir nicht selbst eine Mail schreiben."
    too-long: "<prefix><red>Die Mail ist zu lang (höchstens <max> Zeichen)."
    inbox-full: "<prefix><red>Das Postfach von <white><target></white> ist voll."
    muted: "<prefix><red>Du bist gemutet und kannst keine Mails senden."

# ------------------------------------------------------------
# Teleport-Anfragen (/tpa <spieler>, /tpaccept [spieler], /tpdeny [spieler])
# Der Anfragende zahlt erst, wenn die Anfrage angenommen wird. Mit sess.tpa.free kostenlos.
# Platzhalter: <requester>, <target>, <seconds>, <price> (z.B. "500 Taler" oder "5x Diamant"), <amount>, <item>
# ------------------------------------------------------------
tpa:
  expire-seconds: 60
  cost:
    type: money       # money = vom Bankkonto, item = in Items
    amount: 500       # Betrag bzw. Anzahl Items; 0 = kostenlos für alle
    item: DIAMOND     # nur bei type: item
  messages:
    sent: "<prefix><gray>Anfrage an <white><target></white> gesendet. Sie verfällt in <seconds> Sekunden."
    sent-paid: "<prefix><gray>Anfrage an <white><target></white> gesendet. <dark_gray>(Kosten bei Annahme: <price>)"
    received: "<prefix><white><requester></white><gray> möchte sich zu dir teleportieren. <click:run_command:'/tpaccept <requester>'><hover:show_text:'<green>Annehmen'><green>[Annehmen]</green></hover></click> <click:run_command:'/tpdeny <requester>'><hover:show_text:'<red>Ablehnen'><red>[Ablehnen]</red></hover></click>"
    accepted: "<prefix><green><target> hat deine Anfrage angenommen."
    accepted-paid: "<prefix><green><target> hat deine Anfrage angenommen. <dark_gray>(-<price>)"
    accepted-target: "<prefix><green>Anfrage von <white><requester></white> angenommen."
    denied: "<prefix><red><target> hat deine Anfrage abgelehnt."
    denied-target: "<prefix><gray>Anfrage von <white><requester></white> abgelehnt."
    no-request: "<prefix><red>Keine offene Teleport-Anfrage."
    not-found: "<prefix><red><target> ist nicht online."
    self: "<prefix><red>Du kannst dir selbst keine Anfrage schicken."
    not-enough: "<prefix><red>Du brauchst <white><price></white> für eine Teleport-Anfrage."
    requester-cannot-pay: "<prefix><red><requester> kann <price> nicht mehr bezahlen – Teleport abgebrochen."
    failed: "<prefix><red>Teleport fehlgeschlagen."

# ------------------------------------------------------------
# News (/news, /news read <id>, /newsadmin – auch im Admin-Panel unter "Server")
# News selbst werden im Admin-Panel bearbeitet und in news.yml gespeichert.
# Platzhalter: <id>, <title>, <priority>, <date>, <short>, im Feed zusätzlich <count>, <new>
# ------------------------------------------------------------
news:
  show-on-join: true
  join-delay-seconds: 3
  priorities:
    1: "<gray>Info"
    2: "<yellow>Normal"
    3: "<red>Wichtig"
    4: "<dark_red><bold>DRINGEND</bold>"
  feed:
    header: "<dark_gray>────── <gold><bold>✉ News</bold></gold> <gray>(<count>)</gray> <dark_gray>– <gray>Klicke zum Lesen</gray> ──────"
    entry: "<click:run_command:'/news read <id>'><hover:show_text:'<gray>Klicke, um die ganze Nachricht zu lesen'> <new><dark_gray>[</dark_gray><priority><dark_gray>]</dark_gray> <white><bold><title></bold></white> <dark_gray>»</dark_gray> <gray><short></hover></click>"
    new: "<green><bold>NEU</bold></green> "
    footer: "<dark_gray>──────────────────────────────"
  read:
    header: "<dark_gray>──────</dark_gray> <priority> <dark_gray>|</dark_gray> <white><bold><title></bold></white>"
    date: "<gray>Veröffentlicht am <white><date>"
    footer: "<click:run_command:'/news'><hover:show_text:'<gray>Zurück zur Übersicht'><dark_gray>[<gray>« Alle News</gray>]</dark_gray></hover></click>"
  messages:
    none: "<prefix><gray>Aktuell gibt es keine News."
    not-available: "<prefix><red>Diese News ist nicht verfügbar."
    not-found: "<prefix><red>Diese News existiert nicht."
    saved: "<prefix><green>Gespeichert."
    cancelled: "<prefix><gray>Eingabe abgebrochen."
    deleted: "<prefix><red>News Nr. <id> wurde gelöscht."
    delete-hint: "<prefix><gray>Zum Löschen <red>Shift + Klick</red> benutzen."
    back-to-editor: "<click:run_command:'/newsadmin edit <id>'><hover:show_text:'<gray>Zurück zum Editor'><dark_gray>[<yellow>« Zurück zum Editor</yellow>]</dark_gray></hover></click>"
    invalid-duration: "<prefix><red>Ungültige Zeitangabe. Beispiele: <white>2h</white>, <white>7 Tage</white>, <white>1d 12h</white>. Versuch es nochmal:"
    prompt-title: "<prefix><gray>Gib den neuen <white>Titel</white> im Chat ein. <click:run_command:'/newsadmin cancel'><red>[Abbrechen]</red></click> <dark_gray>(oder <gray>abbrechen</gray> schreiben)"
    prompt-content: "<prefix><gray>Gib den neuen <white>Inhalt</white> im Chat ein.<newline><dark_gray> - <gray>Klickbarer Befehl: <white>[Alle News](/news)</white><newline><dark_gray> - <gray>Zeilenumbruch: <white>\\n</white> <dark_gray>| <gray>Farben: <white>&-Codes</white> oder <white>MiniMessage</white><newline><click:run_command:'/newsadmin cancel'><red>[Abbrechen]</red></click> <dark_gray>(oder <gray>abbrechen</gray> schreiben)"
    prompt-append: "<prefix><gray>Gib den <white>anzuhängenden Text</white> im Chat ein. <click:run_command:'/newsadmin cancel'><red>[Abbrechen]</red></click> <dark_gray>(oder <gray>abbrechen</gray> schreiben)"
    prompt-start: "<prefix><gray>In wie viel Zeit soll die News <white>starten</white>? Z.B. <white>2h</white>, <white>1 Tag</white>. <click:run_command:'/newsadmin cancel'><red>[Abbrechen]</red></click>"
    prompt-end: "<prefix><gray>Wie lange soll die News <white>laufen</white> (ab Start)? Z.B. <white>7 Tage</white>. <click:run_command:'/newsadmin cancel'><red>[Abbrechen]</red></click>"

# ------------------------------------------------------------
# Reports (/report <spieler> <grund>, /reports, /clearreports)
# Zusätzliche Platzhalter: <id>, <target>, <reporter>, <reason>
# ------------------------------------------------------------
reports:
  # Sekunden zwischen zwei /report eines Spielers (Bypass: sess.report.bypasscooldown)
  cooldown: 30
  messages:
    sent: "<prefix><green>Deine Meldung wurde übermittelt! <gray>(ID #<id>)"
    self: "<prefix><red>Du kannst dich nicht selbst melden!"
    unknown-player: "<prefix><red>Der Spieler <white><target></white> war noch nie auf dem Server."
    cooldown: "<prefix><red>Warte noch <time> Sekunde(n), bevor du erneut meldest."
    notify: "<prefix><yellow><reporter></yellow><gray> hat <yellow><target></yellow> gemeldet <dark_gray>(#<id>)</dark_gray>: <white><reason>"
    teleported: "<prefix><green>Du wurdest zu <target> teleportiert."
    offline: "<prefix><red><target> ist gerade nicht online."
    resolved: "<prefix><green>Report #<id> wurde als erledigt markiert."
    deleted: "<prefix><red>Report #<id> wurde gelöscht."
    gone: "<prefix><red>Dieser Report existiert nicht mehr."
    cleared: "<prefix><green><count> offene Report(s) wurden gelöscht."

# ------------------------------------------------------------
# Webpanel – Statistiken aus dem Admin-Panel im Browser (nur lesend, ohne IP-Adressen).
# Login: im Spiel /webpanel → persönlicher Einmal-Link (5 Minuten gültig), danach Sitzung per Cookie.
# Läuft über HTTP ohne Verschlüsselung – für Zugriff von außen am besten hinter einen Reverse-Proxy mit HTTPS
# (z.B. Caddy/nginx) stellen und public-url auf dessen Adresse setzen.
# ------------------------------------------------------------
webpanel:
  enabled: true
  bind: "0.0.0.0"          # 127.0.0.1 = nur lokal erreichbar
  port: 8085               # muss beim Hoster freigegeben sein
  public-url: ""           # Adresse in Login-Links, z.B. https://panel.meinserver.de (leer = http://<server-ip>:<port>)
  session-hours: 12
  refresh-seconds: 30
  messages:
    link: "<prefix><gray>Dein Login-Link (5 Minuten, einmalig): <click:open_url:'<url>'><aqua><u>Webpanel öffnen</u></aqua></click> <dark_gray>– nicht weitergeben!"
    disabled: "<prefix><red>Das Webpanel ist deaktiviert oder konnte nicht starten (siehe Konsole)."
    logged-out: "<prefix><gray>Alle deine Webpanel-Sitzungen wurden beendet."

# ------------------------------------------------------------
# Strafen: Bans, Mutes, IP-Bans – frei (/ban, /mute, /ipban <spieler> [dauer|perm] [grund])
# oder nach Vorlage (/punish <spieler> <id>). Dauer z.B. 30m, 2h, 7d, 1d12h, 1mo, 1y; ohne Dauer = permanent.
# Aufheben: /unban, /unmute, /unbanip; Verlauf: /history <spieler>; Admin-Panel → Moderation → Strafen.
# Platzhalter: <id>, <type>, <verb>, <target>, <reason>, <actor>, <duration>, <remaining>, <date>, <expires>
# ------------------------------------------------------------
punishments:
  broadcast: false              # true = Bans/Mutes auch allen Spielern ansagen (IP-Bans nie)
  # Befehle, die gemutete Spieler nicht nutzen dürfen
  mute-blocked-commands: [msg, tell, w, whisper, r, reply, me, say]
  # Vorgefertigte Strafen: type ban|mute|ipban, duration z.B. 7d oder permanent
  templates:
    "1": { type: ban, duration: 30d, reason: "Hacking / unerlaubte Clients" }
    "2": { type: ban, duration: 7d, reason: "Griefing" }
    "3": { type: mute, duration: 1h, reason: "Beleidigung" }
    "4": { type: mute, duration: 1d, reason: "Spam" }
    "5": { type: ban, duration: 3d, reason: "Ausnutzen von Bugs" }
    "6": { type: ban, duration: permanent, reason: "Schwerer Regelverstoß" }
    "7": { type: ipban, duration: permanent, reason: "Ban-Umgehung" }
  messages:
    ban-screen: "<red><bold>Du wurdest vom Server gebannt</bold></red><newline><newline><gray>Grund: <white><reason></white><newline><gray>Dauer: <white><remaining></white><newline><gray>Ablauf: <white><expires></white><newline><newline><dark_gray>ID #<id>"
    ipban-screen: "<red><bold>Deine IP wurde vom Server gebannt</bold></red><newline><newline><gray>Grund: <white><reason></white><newline><gray>Dauer: <white><remaining></white><newline><newline><dark_gray>ID #<id>"
    muted: "<prefix><red>Du wurdest gemutet: <white><reason></white> <gray>(<duration>)"
    muted-blocked: "<prefix><red>Du bist gemutet: <white><reason></white> <gray>– noch <remaining>"
    unmuted: "<prefix><green>Dein Mute wurde aufgehoben."
    notify: "<prefix><red><actor></red> <gray>hat <white><target></white> <verb> <dark_gray>(<duration>)</dark_gray>: <white><reason></white> <dark_gray>#<id>"
    broadcast: "<prefix><white><target></white> <gray>wurde <verb>: <white><reason>"
    revoked: "<prefix><green><revoker></green> <gray>hat den <type> von <white><target></white> aufgehoben <dark_gray>#<id>"
    not-punished: "<prefix><red><target> hat keinen aktiven <type>."
    unknown-player: "<prefix><red>Der Spieler <white><target></white> war noch nie auf dem Server."
    unknown-template: "<prefix><red>Es gibt keine Vorlage <white><id></white>."
    no-permission: "<prefix><red>Dafür fehlt dir das Recht."
    self: "<prefix><red>Du kannst dich nicht selbst bestrafen."
    exempt: "<prefix><red><target> kann nicht bestraft werden."
    no-ip: "<prefix><red>Für <target> ist keine IP bekannt (noch nie online gewesen?)."
    history-header: "<dark_gray>────── <gold>Strafen von <yellow><target></yellow> <gray>(<count>)</gray> ──────"
    history-entry: "<dark_gray>#<id></dark_gray> <gold><type></gold> <white><reason></white> <gray>– <duration>, von <actor> am <date> – <status>"

# ------------------------------------------------------------
# ItemGuard – entfernt nicht survival-taugliche Items und meldet den Spieler (Report, Absender "ItemGuard").
# Scan beim Join und alle interval-seconds; /itemscan [spieler] (Alias /iscan) scannt sofort.
# Spieler mit sess.itemguard.bypass werden nicht gescannt. Einstellbar auch im Admin-Panel (Moderation → ItemGuard).
# Platzhalter: <items>, <target>, <id> (Report-Nummer)
# ------------------------------------------------------------
itemguard:
  enabled: true
  interval-seconds: 15
  block-spawn-eggs: true      # alle Spawn-Eier entfernen und das Benutzen blockieren
  scan-enderchest: true
  scan-shulkers: true         # Shulkerkisten in Inventar und Enderchest durchsuchen
  banned:
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - COMMAND_BLOCK_MINECART
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW
    - BARRIER
    - SPAWNER
    - DEBUG_STICK
    - KNOWLEDGE_BOOK
    - BEDROCK
    - END_PORTAL_FRAME
    - LIGHT
    - REINFORCED_DEEPSLATE
    - PETRIFIED_OAK_SLAB
    - PLAYER_HEAD
  messages:
    removed: "<prefix><red>Unerlaubte Items wurden entfernt: <white><items>"
    spawn-egg: "<prefix><red>Spawn-Eier dürfen nicht benutzt werden."
    notify: "<prefix><red><target></red> <gray>hatte unerlaubte Items <dark_gray>(Report #<id>)</dark_gray>: <white><items>"
    scanned: "<prefix><green>Inventar von <white><target></white> wurde gescannt."
    scanned-all: "<prefix><green>Alle Spieler wurden gescannt."
    not-online: "<prefix><red>Dieser Spieler ist nicht online."

# ------------------------------------------------------------
# CreativeLog – protokolliert alle Aktionen von Spielern im Kreativmodus (außer mit sess.creativelog.bypass):
# Moduswechsel, Join/Quit, Items aus dem Kreativ-Inventar, Container, Droppen/Aufheben, Blöcke, Rechtsklicks,
# Schaden, Befehle. Abruf: /creativelog <spieler> [seite] (Alias /clog) oder Admin-Panel → Moderation → CreativeLog.
# Platzhalter: <target>, <page>, <pages>, <prev>, <next>
# ------------------------------------------------------------
creativelog:
  enabled: true
  max-entries: 1000     # pro Spieler; ältere Einträge fallen weg
  page-size: 15
  messages:
    header: "<dark_gray>────── <gold>Kreativ-Log: <yellow><target></yellow> <gray>(Seite <page>/<pages>)</gray> ──────"
    footer: "<dark_gray>Neueste zuerst</dark_gray> <click:run_command:'/creativelog <target> <prev>'><yellow>[« Zurück]</yellow></click> <click:run_command:'/creativelog <target> <next>'><yellow>[Weiter »]</yellow></click>"
    none: "<prefix><red>Für <white><target></white> gibt es keine Kreativ-Logs."
    no-page: "<prefix><red>Diese Seite gibt es nicht (nur <pages>)."

# ------------------------------------------------------------
# Client-Detector
# Erkennt beim Join den Client über Brand und Plugin-Channels.
# Hack-Clients nur über Signaturen – getarnte Clients (Brand "vanilla"/"fabric") fallen nicht auf.
# Wer was gemeldet bekommt, stellt jeder Admin im Admin-Panel unter "Benachrichtigungen" ein.
# Platzhalter: <client>, <channels>, <match>, <id> (Meldung im Admin-Panel)
# ------------------------------------------------------------
client-detector:
  enabled: true
  # Wartezeit nach dem Join in Ticks (20 = 1 Sekunde), bis alle Channels registriert sind
  check-delay-ticks: 40
  # true = auch für Mod-Clients (Fabric, Forge, Lunar, ...) eine Meldung im Admin-Panel anlegen
  report-modded: false
  # Treffer = Hack-Client. Geprüft wird, ob Brand oder ein Channel den Text enthält (Groß-/Kleinschreibung egal).
  hack-signatures:
    - wurst
    - meteor
    - aristois
    - liquidbounce
    - rusherhack
    - futureclient
    - inertia
    - konas
    - salhack
    - bleachhack
    - thunderhack
    - phobos
    - 3arthh4ck
  messages:
    vanilla: "<prefix><gray><player> ist mit <green>Vanilla</green> gejoint."
    modded: "<prefix><gray><player> ist mit <yellow><client></yellow> gejoint. <dark_gray>[<hover:show_text:'<gray>Channels:<newline><white><channels>'>Channels</hover>]"
    hack: "<prefix><red><bold>Hack-Client:</bold></red> <white><player></white> <gray>(<client>, Treffer: <red><match></red><gray>) – Meldung #<id> im Admin-Panel."

# ------------------------------------------------------------
# Admin-Panel (/admin)
# Kacheln erscheinen nur mit dem Recht der jeweiligen Anwendung.
# ------------------------------------------------------------
admin:
  title: "<dark_gray>Admin-Panel"

# ------------------------------------------------------------
# TAB-Liste
# ------------------------------------------------------------
tab:
  enabled: true
  update-interval-ticks: 40
  header:
    - ""
    - "<gradient:#00c6ff:#0072ff><bold>MEIN SERVER</bold></gradient>"
    - "<gray>Online: <white><online></white>/<white><max_players></white>"
    - ""
  footer:
    - ""
    - "<gray>Viel Spaß, <white><player></white>!"
    - ""
  # Anzeige des Spielers in der TAB-Liste.
  # Leer lassen (""), damit Prefix/Suffix aus "nametag" auch im TAB genutzt werden.
  player-format: "<lp_prefix><player><lp_suffix>"

# ------------------------------------------------------------
# Nametags (über dem Kopf, nutzt Scoreboard-Teams)
# Die Teams sortieren die TAB-Liste: kleinere priority = weiter oben.
# ------------------------------------------------------------
nametag:
  enabled: true
  default:
    priority: 99
    prefix: "<lp_prefix>"
    suffix: "<lp_suffix>"
    name-color: white     # Farbe des Namens (Vanilla-Farbname)
  groups:
    admin:
      priority: 1
      prefix: "<red>[Admin] "
      suffix: ""
      name-color: red
    # vip:
    #   priority: 10
    #   prefix: "<gold>[VIP] "
    #   suffix: " <yellow>★"
    #   name-color: gold

messages:
  reloaded: "<prefix><green>Konfiguration neu geladen."

# ------------------------------------------------------------
# Item-Upgrader (/upgrader, Alias /upgrade – Recht sess.upgrader)
# Ein Item aus dem Inventar setzen, ein wertvolleres Ziel wählen und drehen: Gewinn = Ziel-Item,
# Verlust = Einsatz weg. Chance = house-factor × Einsatzwert / Zielwert, begrenzt auf min/max-chance.
# Item-Werte: Grundwerte für Rohstoffe sind im Plugin hinterlegt (Erde 1, Eisen 40, Gold 60, Diamant 400,
# Netherstern 4000), alles andere wird aus den Rezepten berechnet. Beschädigte Items zählen anteilig.
# Umbenannte Items, Plugin-Items und gefüllte Behälter (Shulker, Bündel) können nicht gesetzt werden.
# Verwalten: /upgrader admin bzw. Admin-Panel (Wirtschaft → Item-Upgrader); Wert eines Items: /upgrader value [item]
# Platzhalter: <item>, <amount>, <chance>, <value>, <total>
# ------------------------------------------------------------
upgrader:
  house-factor: 0.9
  min-chance: 0.001         # 0,1 %
  max-chance: 0.9           # 90 %
  # Items, die weder gesetzt noch gewonnen werden können
  blacklist:
    - SPAWNER
    - TRIAL_SPAWNER
    - VAULT
    - DRAGON_EGG
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - BEDROCK
    - BARRIER
  # Eigene Werte pro Item, z.B. ELYTRA: 5000 (gehen den Grundwerten und Rezepten vor)
  value-overrides: {}
  messages:
    bet-empty: "<prefix><red>Wähle zuerst einen Einsatz: Klicke ein Item in deinem Inventar an."
    bet-blacklisted: "<prefix><red>Dieses Item kann nicht gesetzt werden."
    bet-no-value: "<prefix><red>Dieses Item hat keinen Wert und kann nicht gesetzt werden."
    bet-modified: "<prefix><red>Umbenannte oder besondere Items können nicht gesetzt werden."
    bet-container: "<prefix><red>Leere den Behälter zuerst – sein Inhalt würde sonst mit verloren gehen."
    bet-changed: "<prefix><red>Dein Einsatz hat sich im Inventar verändert – wähle ihn neu aus."
    target-empty: "<prefix><red>Wähle zuerst ein Ziel."
    won: "<prefix><green>Upgrade geglückt! Du bekommst <white><amount>x <item></white>. <dark_gray>(Chance <chance>)"
    lost: "<prefix><red>Upgrade fehlgeschlagen – dein Einsatz ist weg. <dark_gray>(Chance <chance>)"
    delivered: "<prefix><green>Dein Gewinn aus dem Item-Upgrader wurde nachgeliefert."
    value: "<prefix><gray>Wert von <white><item></white>: <gold><value></gold> pro Stück, <gold><total></gold> für <amount> Stück."
    value-unknown: "<prefix><gray>Dieses Item hat keinen Upgrader-Wert."
    prompt-amount: "<prefix><gray>Wie viele möchtest du gewinnen? Zahl im Chat eingeben. <click:suggest_command:'abbrechen'><red>[Abbrechen]</red></click>"
    prompt-search: "<prefix><gray>Suchbegriff im Chat eingeben (englischer Name, <white>-</white> = alle). <click:suggest_command:'abbrechen'><red>[Abbrechen]</red></click>"
    prompt-value: "<prefix><gray>Neuen Wert im Chat eingeben oder <white>reset</white> für den berechneten Wert. <click:suggest_command:'abbrechen'><red>[Abbrechen]</red></click>"
    invalid-number: "<prefix><red>Ungültige Zahl."

# ------------------------------------------------------------
# Auto-Update aus GitHub-Releases (vom Build-Workflow bei einem Tag wie v1.2.3 veröffentlicht).
# Prüft täglich zur Uhrzeit, ob es ein neueres Release gibt, lädt das Jar, prüft SHA-256 und plugin.yml
# und legt es in den Update-Ordner (plugins/update) – aktiv nach dem nächsten Neustart.
# An/aus: /autoupdate an|aus oder Admin-Panel (Server → Auto-Update). Sofort prüfen: /autoupdate check
# Platzhalter: <version>, <current>, <error>, <repository>, <state>, <time>, <result>
# ------------------------------------------------------------
auto-update:
  enabled: false
  repository: mauricebrn/SEssentials   # besitzer/repo auf GitHub
  time: "04:00"                        # tägliche Prüfung, Serverzeit (HH:mm, in Anführungszeichen)
  token: ""                            # nur für private Repos: GitHub-Token mit Lesezugriff auf Inhalte
  restart-minutes: 0                   # > 0 = nach einem Update Softrestart in X Minuten starten
  messages:
    enabled: "<prefix><green>Auto-Update eingeschaltet."
    disabled: "<prefix><gray>Auto-Update ausgeschaltet."
    status: "<prefix><gray>Auto-Update: <white><state></white> · <white><repository></white> täglich um <white><time></white> · installiert <white><current></white><newline><gray>Letzte Prüfung: <white><result>"
    checking: "<prefix><gray>Suche nach Updates …"
    busy: "<prefix><gray>Es läuft bereits eine Prüfung."
    up-to-date: "<prefix><green>SEssentials ist aktuell (<current>)."
    already-staged: "<prefix><gray>Version <white><version></white> ist schon heruntergeladen und wird beim nächsten Neustart aktiv."
    no-release: "<prefix><gray>Im Repository <white><repository></white> gibt es noch kein Release."
    staged: "<prefix><green>Update <white><version></white> heruntergeladen (installiert: <current>) – aktiv nach dem nächsten Neustart."
    failed: "<prefix><red>Auto-Update fehlgeschlagen: <white><error>"

# ------------------------------------------------------------
# Fake-Spieler (/fakeplayer, Aliase /fp, /bot – Recht sess.fakeplayer)
# Echte Spieler ohne Client: online im TAB und in /list, laden Chunks wie ein Spieler (Pflanzen wachsen,
# Mobs spawnen) und sind Ziel aller Befehle (/msg, /mail, /ban, /tp, /give, …). Inventar und Position
# speichert der Server wie bei jedem Spieler.
#   /fp create <name> [skin]   an deiner Position erstellen (Skin = Spielername, Standard: der Name)
#   /fp join|leave <name>      beitreten / verlassen (bleibt erhalten); nach Kick oder Ban offline bis /fp join
#   /fp remove <name>          endgültig entfernen
#   /fp tp|tphere|equip|inv <name>   hinreisen, herholen (setzt den Heimatpunkt), deine Ausrüstung kopieren, Inventar öffnen
#   /fp ai <name> on|off       KI ein/aus
#   /fp goal <name> wander|mobs|players|all   Angriff: nur herumlaufen bzw. Mobs / Spieler / beides von sich aus bekämpfen
#   /fp goal <name> mine <block>              einen Blocktyp abbauen, z.B. mine diamond_ore: sucht freiliegende
#                                             Blöcke um den Heimatpunkt, baut sie mit dem Werkzeug in der Hand ab
#                                             und sammelt die Drops ein (Schutz-Plugins greifen wie bei Spielern)
#   /fp defense <name> flee|fight|ignore      Verteidigung, wenn ihn ein Spieler oder Mob trifft: weglaufen,
#                                             zurückschlagen (bei wenig Leben doch weglaufen) oder nichts tun
#   /fp skin <name> <skin>     /fp list
#   /fp animate <name>         den Fake-Spieler selbst steuern: du wirst unsichtbar und "verlässt" den Server
#                              (Leave-Nachricht), er übernimmt deine Bewegungen, Armschwünge und deinen Chat.
#                              Deine Befehle (außer /fp) führt er aus – mit deinen Rechten, die er dafür erbt
#                              (bei OP vorübergehend OP) – und du bekommst die Ausgabe.
#                              Nochmal bzw. /fp animate beendet es (Join-Nachricht für dich). War er offline,
#                              tritt er dafür bei und verlässt den Server danach wieder.
# Kämpfende Fake-Spieler greifen nur echte Spieler im Überlebens-/Abenteuermodus an, nicht im Vanish und
# nicht mit sess.fakeplayer.ignore. Nach dem Tod erscheinen sie nach respawn-seconds am Heimatpunkt.
# Tritt ein echter Spieler mit demselben Namen bei, verlässt der Fake-Spieler den Server.
# Platzhalter: <name>, <skin>, <goal>, <defense>, <count>, <state>, <location>
# ------------------------------------------------------------
fakeplayers:
  max: 20
  respawn-seconds: 5
  wander-radius: 12            # Blöcke um den Heimatpunkt
  aggro-range: 16              # Suchradius für Gegner
  attack-cooldown-ticks: 12    # 20 Ticks = 1 Sekunde
  # Startwerte für neu erstellte Fake-Spieler (danach mit /fp ai, /fp goal, /fp defense änderbar)
  defaults:
    ai: false
    goal: wander               # wander, mobs, players, all
    defense: flee              # flee, fight, ignore
  mining:
    radius: 16                 # Blöcke um den Heimatpunkt (nach oben/unten die Hälfte)
  defense:
    flee-distance: 16          # so weit (Blöcke) läuft er vor dem Angreifer weg
    flee-seconds: 10           # höchstens so lange
    flee-below-health: 6       # bei "fight": unter so viel Leben (2 = 1 Herz) doch weglaufen; 0 = nie
  animate:
    announce: true             # beim Animieren Leave-/Join-Nachricht für dich senden
  messages:
    created: "<prefix><green>Fake-Spieler <white><name></white> erstellt (Skin: <skin>). KI: <white>/fp ai <name> on</white>"
    removed: "<prefix><gray>Fake-Spieler <white><name></white> entfernt."
    joined: "<prefix><green><white><name></white> ist dem Server beigetreten."
    left: "<prefix><gray><white><name></white> hat den Server verlassen."
    already-online: "<prefix><red><white><name></white> ist schon online."
    name-in-use: "<prefix><red>Ein Spieler namens <white><name></white> ist bereits online."
    banned: "<prefix><red><white><name></white> ist gebannt und kann nicht beitreten."
    join-failed: "<prefix><red><white><name></white> konnte nicht beitreten – Details in der Konsole."
    offline: "<prefix><red><white><name></white> ist gerade offline (<white>/fp join <name></white>)."
    exists: "<prefix><red>Der Name <white><name></white> ist schon vergeben."
    invalid-name: "<prefix><red>Ungültiger Name <white><name></white> – 3 bis 16 Zeichen, nur Buchstaben, Zahlen und _."
    limit: "<prefix><red>Es gibt schon <count> Fake-Spieler (Maximum)."
    not-found: "<prefix><red>Kein Fake-Spieler namens <white><name></white>."
    list-empty: "<prefix><gray>Es gibt keine Fake-Spieler."
    list-header: "<prefix><gray>Fake-Spieler (<white><count></white>):"
    list-entry: "<dark_gray> - <white><name></white> <dark_gray>»</dark_gray> <gray><state></gray> <dark_gray>(<location>)"
    ai-on: "<prefix><green>KI von <white><name></white> eingeschaltet: <goal>."
    ai-off: "<prefix><gray>KI von <white><name></white> ausgeschaltet."
    goal-set: "<prefix><gray>Ziel von <white><name></white>: <white><goal></white>."
    defense-set: "<prefix><gray>Verteidigung von <white><name></white>: <white><defense></white>."
    invalid-block: "<prefix><red>Das ist kein abbaubarer Block."
    ai-hint: "<prefix><gray>Hinweis: Die KI von <white><name></white> ist aus – einschalten mit <white>/fp ai <name> on</white>."
    skin-set: "<prefix><gray>Skin von <white><name></white> auf <white><skin></white> gesetzt."
    equipped: "<prefix><gray><white><name></white> trägt jetzt eine Kopie deiner Ausrüstung."
    teleported: "<prefix><gray>Zu <white><name></white> teleportiert."
    moved: "<prefix><gray><white><name></white> ist jetzt hier (neuer Heimatpunkt)."
    animate-start: "<prefix><green>Du steuerst jetzt <white><name></white>. Dein Chat läuft über ihn. Beenden: <white>/fp animate</white>"
    animate-stop: "<prefix><gray>Du steuerst <white><name></white> nicht mehr."
    animate-none: "<prefix><red>Du steuerst gerade keinen Fake-Spieler."
    animate-busy: "<prefix><red><white><name></white> wird schon von jemand anderem gesteuert."
    animate-output: "<dark_gray>[<gray><name></gray>]</dark_gray> <output>"
    login-denied: "<prefix><red><white><name></white> wurde beim Login abgewiesen – Grund in der Konsole."
