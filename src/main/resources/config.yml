# ============================================================
#  SEssentials – Konfiguration
#  Alle Texte unterstützen MiniMessage (https://webui.advntr.dev/)
#  und zusätzlich &-Farbcodes (z.B. aus LuckPerms-Prefixen).
#
#  Verfügbare Platzhalter (überall, wo ein Spieler im Kontext ist):
#    <player>          Spielername
#    <displayname>     Anzeigename
#    <world>           Welt des Spielers
#    <online>          Spieler online
#    <max_players>     Maximale Spieler
#    <lp_prefix>       LuckPerms-Prefix
#    <lp_suffix>       LuckPerms-Suffix
#    <lp_group>        LuckPerms-Primärgruppe
#    <lp_meta:KEY>     LuckPerms-Meta-Wert (z.B. <lp_meta:color>)
#    <papi:NAME>       PlaceholderAPI-Platzhalter, z.B. <papi:luckperms_prefix>
#    %NAME%            PlaceholderAPI-Platzhalter in klassischer Schreibweise
# ============================================================

prefix: "<dark_gray>[<gradient:#00c6ff:#0072ff>SEssentials</gradient>]</dark_gray> "

# ------------------------------------------------------------
# Softrestart
# ------------------------------------------------------------
softrestart:
  # Sekunden vor dem Neustart, bei denen alle Spieler informiert werden
  announce-at: [3600, 1800, 900, 600, 300, 120, 60, 30, 15, 10, 5, 4, 3, 2, 1]
  # Zusätzlich einen Titel ab dieser Restzeit (Sekunden) anzeigen, 0 = aus
  title-below: 10
  bossbar:
    enabled: true
    text: "<red>Server-Neustart in <white><time></white>"
    color: RED            # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
  # Befehl, der nach Kick + Speichern über die Konsole ausgeführt wird.
  # "restart" nutzt das restart-script aus spigot.yml, "stop" fährt nur herunter.
  final-command: "restart"
  messages:
    started: "<prefix><green>Softrestart geplant in <white><time></white>."
    announce: "<prefix><red>Der Server startet in <white><time></white> neu!"
    title: "<red><bold>Neustart"
    subtitle: "<gray>in <white><time></white>"
    cancelled: "<prefix><green>Der geplante Neustart wurde abgebrochen."
    already-running: "<prefix><red>Es läuft bereits ein Softrestart (noch <time>). Nutze /softrestart cancel."
    not-running: "<prefix><red>Es ist kein Softrestart geplant."
    status: "<prefix><gray>Neustart in <white><time></white>."
    saving: "<prefix><yellow>Server wird gespeichert und neu gestartet..."
    kick: "<red><bold>Server-Neustart</bold></red><newline><newline><gray>Der Server startet gerade neu.<newline>Bitte verbinde dich in ein paar Minuten erneut."
  time-format:
    minutes: "<m> Minute(n)"
    minutes-seconds: "<m>:<ss> Minuten"
    seconds: "<s> Sekunde(n)"

# ------------------------------------------------------------
# Chat
# ------------------------------------------------------------
chat:
  enabled: true
  # <message> = die Nachricht des Spielers
  default-format: "<lp_prefix><gray><player></gray><lp_suffix> <dark_gray>»</dark_gray> <white><message>"
  # Eigene Formate pro LuckPerms-Primärgruppe
  group-formats:
    admin: "<lp_prefix><red><hover:show_text:'<gray>Gruppe: <lp_group>'><player></hover></red> <dark_gray>»</dark_gray> <white><message>"
    # vip: "<gold>[VIP] <player> <dark_gray>»</dark_gray> <yellow><message>"

# ------------------------------------------------------------
# Join- / Leave-Nachrichten
# Leer lassen (""), um die Nachricht komplett auszublenden.
# enabled: false = Vanilla-Nachrichten bleiben unverändert.
# ------------------------------------------------------------
join-quit:
  enabled: true
  join: "<dark_gray>[<green>+</green>]</dark_gray> <lp_prefix><gray><player></gray>"
  quit: "<dark_gray>[<red>-</red>]</dark_gray> <lp_prefix><gray><player></gray>"

# ------------------------------------------------------------
# Vanish (/vanish, Alias /v)
# Versteckte Spieler sind für alle ohne sess.vanish.see unsichtbar (Welt, TAB, Commands,
# Serverliste, <online>). Sie können nicht chatten, bauen, abbauen, schlagen oder einsammeln.
# Beim Ein-/Ausblenden wird eine Fake-Leave/Join-Nachricht (Texte aus join-quit) gesendet.
# ------------------------------------------------------------
vanish:
  # false = beim Ein-/Ausblenden nie Fake-Nachrichten senden
  # Einzeln im Spiel: /vanish silent schaltet ohne Fake-Nachricht um
  fake-messages: true
  # Mindestabstand in Sekunden zwischen zwei Fake-Nachrichten eines Spielers (gegen Spam)
  fake-message-cooldown: 60
  # Was im Vanish blockiert wird (true = blockiert).
  # Einzeln im Spiel: /vanish bypass (Recht sess.vanish.bypass) hebt alle Schutzregeln auf
  protections:
    pickup: true
    chat: true
    break: true
    place: true
    damage: true
  messages:
    enabled: "<prefix><gray>Du bist jetzt <green>unsichtbar</green>."
    disabled: "<prefix><gray>Du bist jetzt wieder <red>sichtbar</red>."
    join-vanished: "<prefix><gray>Du bist <green>unsichtbar</green> beigetreten."
    cooldown: "<prefix><gray>Keine Fake-Nachricht gesendet (Cooldown)."
    blocked: "<red>Im Vanish nicht möglich."
    bypass-on: "<prefix><gray>Schutz-Bypass <green>aktiv</green> – du kannst chatten, bauen, abbauen, schlagen und einsammeln."
    bypass-off: "<prefix><gray>Schutz-Bypass <red>aus</red>."
    staff-join: "<prefix><gray><player> ist unsichtbar beigetreten."
    staff-quit: "<prefix><gray><player> hat den Server unsichtbar verlassen."

# ------------------------------------------------------------
# /fly, /heal, /feed, /god  (optional mit <spieler>)
# ------------------------------------------------------------
player-commands:
  messages:
    fly-on: "<prefix><gray>Flugmodus <green>aktiviert</green>."
    fly-off: "<prefix><gray>Flugmodus <red>deaktiviert</red>."
    heal: "<prefix><gray>Du wurdest <green>geheilt</green>."
    feed: "<prefix><gray>Dein Hunger wurde <green>gestillt</green>."
    god-on: "<prefix><gray>God-Modus <green>aktiviert</green>."
    god-off: "<prefix><gray>God-Modus <red>deaktiviert</red>."
    # an den Ausführenden, wenn er den Befehl für einen anderen Spieler nutzt
    other: "<prefix><gray>/<command> für <white><player></white> ausgeführt."
    player-only: "<prefix><red>Nur für Spieler – nutze /<command> <spieler>."

# ------------------------------------------------------------
# TAB-Liste
# ------------------------------------------------------------
tab:
  enabled: true
  update-interval-ticks: 40
  header:
    - ""
    - "<gradient:#00c6ff:#0072ff><bold>MEIN SERVER</bold></gradient>"
    - "<gray>Online: <white><online></white>/<white><max_players></white>"
    - ""
  footer:
    - ""
    - "<gray>Viel Spaß, <white><player></white>!"
    - ""
  # Anzeige des Spielers in der TAB-Liste.
  # Leer lassen (""), damit Prefix/Suffix aus "nametag" auch im TAB genutzt werden.
  player-format: "<lp_prefix><player><lp_suffix>"

# ------------------------------------------------------------
# Nametags (über dem Kopf, nutzt Scoreboard-Teams)
# Die Teams sortieren die TAB-Liste: kleinere priority = weiter oben.
# ------------------------------------------------------------
nametag:
  enabled: true
  default:
    priority: 99
    prefix: "<lp_prefix>"
    suffix: "<lp_suffix>"
    name-color: white     # Farbe des Namens (Vanilla-Farbname)
  groups:
    admin:
      priority: 1
      prefix: "<red>[Admin] "
      suffix: ""
      name-color: red
    # vip:
    #   priority: 10
    #   prefix: "<gold>[VIP] "
    #   suffix: " <yellow>★"
    #   name-color: gold

messages:
  reloaded: "<prefix><green>Konfiguration neu geladen."
