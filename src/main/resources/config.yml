# ============================================================
#  SEssentials – Konfiguration
#  Alle Texte unterstützen MiniMessage (https://webui.advntr.dev/)
#  und zusätzlich &-Farbcodes (z.B. aus LuckPerms-Prefixen).
#
#  Verfügbare Platzhalter (überall, wo ein Spieler im Kontext ist):
#    <player>          Spielername
#    <displayname>     Anzeigename
#    <world>           Welt des Spielers
#    <online>          Spieler online
#    <max_players>     Maximale Spieler
#    <lp_prefix>       LuckPerms-Prefix
#    <lp_suffix>       LuckPerms-Suffix
#    <lp_group>        LuckPerms-Primärgruppe
#    <lp_meta:KEY>     LuckPerms-Meta-Wert (z.B. <lp_meta:color>)
#    <papi:NAME>       PlaceholderAPI-Platzhalter, z.B. <papi:luckperms_prefix>
#    %NAME%            PlaceholderAPI-Platzhalter in klassischer Schreibweise
# ============================================================

prefix: "<dark_gray>[<gradient:#00c6ff:#0072ff>SEssentials</gradient>]</dark_gray> "

# ------------------------------------------------------------
# Softrestart
# ------------------------------------------------------------
softrestart:
  # Sekunden vor dem Neustart, bei denen alle Spieler informiert werden
  announce-at: [3600, 1800, 900, 600, 300, 120, 60, 30, 15, 10, 5, 4, 3, 2, 1]
  # Zusätzlich einen Titel ab dieser Restzeit (Sekunden) anzeigen, 0 = aus
  title-below: 10
  bossbar:
    enabled: true
    text: "<red>Server-Neustart in <white><time></white>"
    color: RED            # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
  # Befehl, der nach Kick + Speichern über die Konsole ausgeführt wird.
  # "restart" nutzt das restart-script aus spigot.yml, "stop" fährt nur herunter.
  final-command: "restart"
  messages:
    started: "<prefix><green>Softrestart geplant in <white><time></white>."
    announce: "<prefix><red>Der Server startet in <white><time></white> neu!"
    title: "<red><bold>Neustart"
    subtitle: "<gray>in <white><time></white>"
    cancelled: "<prefix><green>Der geplante Neustart wurde abgebrochen."
    already-running: "<prefix><red>Es läuft bereits ein Softrestart (noch <time>). Nutze /softrestart cancel."
    not-running: "<prefix><red>Es ist kein Softrestart geplant."
    status: "<prefix><gray>Neustart in <white><time></white>."
    saving: "<prefix><yellow>Server wird gespeichert und neu gestartet..."
    kick: "<red><bold>Server-Neustart</bold></red><newline><newline><gray>Der Server startet gerade neu.<newline>Bitte verbinde dich in ein paar Minuten erneut."
  time-format:
    minutes: "<m> Minute(n)"
    minutes-seconds: "<m>:<ss> Minuten"
    seconds: "<s> Sekunde(n)"

# ------------------------------------------------------------
# Chat
# ------------------------------------------------------------
chat:
  enabled: true
  # <message> = die Nachricht des Spielers
  default-format: "<lp_prefix><gray><player></gray><lp_suffix> <dark_gray>»</dark_gray> <white><message>"
  # Eigene Formate pro LuckPerms-Primärgruppe
  group-formats:
    admin: "<lp_prefix><red><hover:show_text:'<gray>Gruppe: <lp_group>'><player></hover></red> <dark_gray>»</dark_gray> <white><message>"
    # vip: "<gold>[VIP] <player> <dark_gray>»</dark_gray> <yellow><message>"

# ------------------------------------------------------------
# Join- / Leave-Nachrichten
# Leer lassen (""), um die Nachricht komplett auszublenden.
# enabled: false = Vanilla-Nachrichten bleiben unverändert.
# ------------------------------------------------------------
join-quit:
  enabled: true
  join: "<dark_gray>[<green>+</green>]</dark_gray> <lp_prefix><gray><player></gray>"
  quit: "<dark_gray>[<red>-</red>]</dark_gray> <lp_prefix><gray><player></gray>"

# ------------------------------------------------------------
# Vanish (/vanish, Alias /v)
# Versteckte Spieler sind für alle ohne sess.vanish.see unsichtbar (Welt, TAB, Commands,
# Serverliste, <online>). Sie können nicht chatten, bauen, abbauen, schlagen oder einsammeln.
# Beim Ein-/Ausblenden wird eine Fake-Leave/Join-Nachricht (Texte aus join-quit) gesendet.
# ------------------------------------------------------------
vanish:
  # false = beim Ein-/Ausblenden nie Fake-Nachrichten senden
  # Einzeln im Spiel: /vanish silent schaltet ohne Fake-Nachricht um
  fake-messages: true
  # Mindestabstand in Sekunden zwischen zwei Fake-Nachrichten eines Spielers (gegen Spam)
  fake-message-cooldown: 60
  # Was im Vanish blockiert wird (true = blockiert).
  # Einzeln im Spiel: /vanish bypass (Recht sess.vanish.bypass) hebt alle Schutzregeln auf
  protections:
    pickup: true
    chat: true
    break: true
    place: true
    damage: true
  messages:
    enabled: "<prefix><gray>Du bist jetzt <green>unsichtbar</green>."
    disabled: "<prefix><gray>Du bist jetzt wieder <red>sichtbar</red>."
    join-vanished: "<prefix><gray>Du bist <green>unsichtbar</green> beigetreten."
    cooldown: "<prefix><gray>Keine Fake-Nachricht gesendet (Cooldown)."
    blocked: "<red>Im Vanish nicht möglich."
    bypass-on: "<prefix><gray>Schutz-Bypass <green>aktiv</green> – du kannst chatten, bauen, abbauen, schlagen und einsammeln."
    bypass-off: "<prefix><gray>Schutz-Bypass <red>aus</red>."
    staff-join: "<prefix><gray><player> ist unsichtbar beigetreten."
    staff-quit: "<prefix><gray><player> hat den Server unsichtbar verlassen."

# ------------------------------------------------------------
# /fly, /heal, /feed, /god  (optional mit <spieler>)
# ------------------------------------------------------------
player-commands:
  messages:
    fly-on: "<prefix><gray>Flugmodus <green>aktiviert</green>."
    fly-off: "<prefix><gray>Flugmodus <red>deaktiviert</red>."
    heal: "<prefix><gray>Du wurdest <green>geheilt</green>."
    feed: "<prefix><gray>Dein Hunger wurde <green>gestillt</green>."
    god-on: "<prefix><gray>God-Modus <green>aktiviert</green>."
    god-off: "<prefix><gray>God-Modus <red>deaktiviert</red>."
    # an den Ausführenden, wenn er den Befehl für einen anderen Spieler nutzt
    other: "<prefix><gray>/<command> für <white><player></white> ausgeführt."
    player-only: "<prefix><red>Nur für Spieler – nutze /<command> <spieler>."

# ------------------------------------------------------------
# /nether und /end – im Nether/End führt derselbe Befehl zurück in die Oberwelt
# ------------------------------------------------------------
dimensions:
  messages:
    nether: "<prefix><gray>Willkommen im <red>Nether</red>."
    end: "<prefix><gray>Willkommen im <light_purple>End</light_purple>."
    overworld: "<prefix><gray>Zurück in der <green>Oberwelt</green>."
    world-missing: "<prefix><red>Diese Dimension ist auf dem Server nicht aktiviert."

# ------------------------------------------------------------
# Hilfe (/help [seite], Alias /?) – ersetzt die Vanilla-Hilfe
# Eine Zeile ist entweder Text oder {text: "...", permission: "..."} (nur mit dem Recht sichtbar).
# Seiten ohne sichtbare Zeile werden übersprungen. In allen Texten: <page>, <pages>.
# Klickbare Befehle: <click:suggest_command:'/spawn'>...</click> oder <click:run_command:'/spawn'>...</click>
# ------------------------------------------------------------
help:
  header: "<dark_gray>────── <gold>Hilfe</gold> <gray>(<page>/<pages>)</gray> ──────"
  footer: "<dark_gray>──────</dark_gray> <previous> <next> <dark_gray>──────"
  previous: "<click:run_command:'/help <target>'><hover:show_text:'<gray>Seite <target>'><yellow>[« Zurück]</yellow></hover></click>"
  next: "<click:run_command:'/help <target>'><hover:show_text:'<gray>Seite <target>'><yellow>[Weiter »]</yellow></hover></click>"
  empty: "<prefix><gray>Keine Hilfe verfügbar."
  pages:
    - - "<click:suggest_command:'/spawn'><gold>/spawn</gold></click> <gray>– Zum Spawn teleportieren"
      - "<click:suggest_command:'/news'><gold>/news</gold></click> <gray>– Aktuelle Neuigkeiten"
      - "<click:suggest_command:'/bank'><gold>/bank</gold></click> <gray>– Items einzahlen, Kontostand, Auszahlen"
      - "<click:suggest_command:'/pay '><gold>/pay <spieler> <betrag></gold></click> <gray>– Geld überweisen"
      - "<click:suggest_command:'/tpa '><gold>/tpa <spieler></gold></click> <gray>– Teleport-Anfrage senden"
      - "<click:suggest_command:'/report '><gold>/report <spieler> <grund></gold></click> <gray>– Spieler melden"
      - "<click:suggest_command:'/help 2'><gold>/help <seite></gold></click> <gray>– Weitere Seiten"
      - "<gray>Discord: <click:open_url:'https://discord.gg/DEIN-LINK'><aqua><u>discord.gg/DEIN-LINK</u></aqua></click>"
    - - text: "<click:suggest_command:'/admin'><red>/admin</red></click> <gray>– Admin-Panel"
        permission: sess.admin
      - text: "<click:suggest_command:'/vanish'><red>/vanish</red></click> <gray>– Unsichtbar ein/aus"
        permission: sess.vanish
      - text: "<click:suggest_command:'/reports'><red>/reports</red></click> <gray>– Offene Reports"
        permission: sess.reports.admin
      - text: "<click:suggest_command:'/fly'><red>/fly</red></click> <gray>, /god, /heal, /feed – Spieler-Befehle"
        permission: sess.fly
      - text: "<click:suggest_command:'/softrestart '><red>/softrestart <minuten></red></click> <gray>– Neustart planen"
        permission: sess.softrestart

# ------------------------------------------------------------
# Spawn (/spawn, /setspawn)
# Mit sess.spawn ist /spawn kostenlos, sonst kostet es den Betrag unten (Konto oder Items).
# Platzhalter in den Kosten-Texten: <price>, <amount>, <item>
# Neue Spieler und Respawns ohne Bett/Anker landen exakt am gesetzten Spawn.
# ------------------------------------------------------------
spawn:
  cost:
    type: money       # money = vom Bankkonto, item = in Items
    amount: 500       # Betrag bzw. Anzahl Items; 0 = kostenlos für alle
    item: DIAMOND     # nur bei type: item, z.B. DIAMOND, EMERALD, GOLD_INGOT
  messages:
    set: "<prefix><green>Spawn auf deine Position gesetzt."
    teleported: "<prefix><gray>Du wurdest zum <green>Spawn</green> teleportiert."
    teleported-paid: "<prefix><gray>Du wurdest zum <green>Spawn</green> teleportiert. <dark_gray>(-<price>)"
    not-enough: "<prefix><red>Du brauchst <white><price></white>, um dich zum Spawn zu teleportieren."
    failed: "<prefix><red>Teleport fehlgeschlagen."

# ------------------------------------------------------------
# Bank (/bank, /balance, /pay, /baltop, /eco)
# Spieler zahlen Items auf ein digitales Konto ein und bezahlen damit Befehle, andere Spieler
# und – mit Vault – andere Plugins (Shops usw.). Beträge sind ganze Einheiten.
# Platzhalter: <amount>, <balance>, <target>, <sender>, <rank>, <name>
# ------------------------------------------------------------
bank:
  currency:
    singular: "Taler"
    plural: "Taler"
  start-balance: 0
  # Einzahlbare Materialien mit Wert pro Item. Das erste ist das Basis-Material.
  materials:
    DIAMOND: 100
    NETHERITE_INGOT: 1000
    EMERALD: 50
    IRON_INGOT: 5
  # false = nur das Basis-Material (erstes oben) zählt
  multiple-materials: true
  # true = auch die Blöcke (z.B. Diamantblock = 9 Diamanten) ein- und auszahlen
  allow-blocks: true
  withdraw:
    enabled: true
    # original = in den Materialien oben (größte Werte zuerst), base = nur im Basis-Material
    mode: original
    # Schnell-Buttons im /bank-Menü
    presets: [100, 1000, 6400]
  messages:
    balance: "<prefix><gray>Kontostand: <gold><balance>"
    balance-other: "<prefix><gray>Kontostand von <white><target></white>: <gold><balance>"
    deposited: "<prefix><green>+<amount></green> <gray>eingezahlt. Kontostand: <gold><balance>"
    nothing-to-deposit: "<prefix><red>Du hast nichts Einzahlbares im Inventar."
    nothing-in-hand: "<prefix><red>Das Item in deiner Hand kann nicht eingezahlt werden."
    withdrawn: "<prefix><gray><amount> ausgezahlt. Kontostand: <gold><balance>"
    withdrawn-partial: "<prefix><gray><amount> ausgezahlt – der Rest ist kleiner als die kleinste Einheit und bleibt auf dem Konto. Kontostand: <gold><balance>"
    withdraw-disabled: "<prefix><red>Auszahlen ist auf diesem Server deaktiviert."
    withdraw-too-small: "<prefix><red>Der kleinste auszahlbare Betrag ist <amount>."
    not-enough: "<prefix><red>Dein Kontostand reicht nicht für <amount> (<balance>)."
    paid: "<prefix><gray>Du hast <white><target></white> <gold><amount></gold> überwiesen."
    received: "<prefix><white><sender></white> <gray>hat dir <gold><amount></gold> überwiesen."
    pay-self: "<prefix><red>Du kannst dir nicht selbst Geld überweisen."
    unknown-player: "<prefix><red>Der Spieler <white><target></white> war noch nie auf dem Server."
    invalid-amount: "<prefix><red>Ungültiger Betrag."
    cancelled: "<prefix><gray>Eingabe abgebrochen."
    prompt-withdraw: "<prefix><gray>Wie viel möchtest du auszahlen? Betrag im Chat eingeben. <click:suggest_command:'abbrechen'><red>[Abbrechen]</red></click>"
    prompt-admin: "<prefix><gray>Kontostand von <white><target></white> ändern: <white>+100</white>, <white>-50</white> oder <white>=200</white>. <click:suggest_command:'abbrechen'><red>[Abbrechen]</red></click>"
    admin-updated: "<prefix><gray>Kontostand von <white><target></white>: <gold><balance>"
    baltop-header: "<dark_gray>────── <gold><bold>Reichste Spieler</bold></gold> ──────"
    baltop-entry: "<gray><rank>. <white><name></white> <dark_gray>»</dark_gray> <gold><balance>"

# ------------------------------------------------------------
# Item-Tracker (Admin-Panel → Wirtschaft → Item-Tracker, Recht sess.tracker)
# Zählt wertvolle Items in Inventar und Enderchest (inkl. Shulkerkisten darin) beim Join, beim Verlassen
# und regelmäßig. Verlauf: 24 h vollständig, bis 7 Tage stündlich, danach täglich. Werte nach bank.materials.
# ------------------------------------------------------------
tracker:
  enabled: true
  interval-minutes: 10
  history-days: 30
  include-shulkers: true
  # Höchstens 18 werden im Menü angezeigt
  items:
    - DIAMOND
    - DIAMOND_BLOCK
    - NETHERITE_INGOT
    - NETHERITE_BLOCK
    - NETHERITE_SCRAP
    - ANCIENT_DEBRIS
    - EMERALD
    - EMERALD_BLOCK
    - GOLD_INGOT
    - GOLD_BLOCK
    - IRON_INGOT
    - IRON_BLOCK
    - ENCHANTED_GOLDEN_APPLE
    - TOTEM_OF_UNDYING
    - ELYTRA
    - BEACON

# ------------------------------------------------------------
# Teleport-Anfragen (/tpa <spieler>, /tpaccept [spieler], /tpdeny [spieler])
# Der Anfragende zahlt erst, wenn die Anfrage angenommen wird. Mit sess.tpa.free kostenlos.
# Platzhalter: <requester>, <target>, <seconds>, <price> (z.B. "500 Taler" oder "5x Diamant"), <amount>, <item>
# ------------------------------------------------------------
tpa:
  expire-seconds: 60
  cost:
    type: money       # money = vom Bankkonto, item = in Items
    amount: 500       # Betrag bzw. Anzahl Items; 0 = kostenlos für alle
    item: DIAMOND     # nur bei type: item
  messages:
    sent: "<prefix><gray>Anfrage an <white><target></white> gesendet. Sie verfällt in <seconds> Sekunden."
    sent-paid: "<prefix><gray>Anfrage an <white><target></white> gesendet. <dark_gray>(Kosten bei Annahme: <price>)"
    received: "<prefix><white><requester></white><gray> möchte sich zu dir teleportieren. <click:run_command:'/tpaccept <requester>'><hover:show_text:'<green>Annehmen'><green>[Annehmen]</green></hover></click> <click:run_command:'/tpdeny <requester>'><hover:show_text:'<red>Ablehnen'><red>[Ablehnen]</red></hover></click>"
    accepted: "<prefix><green><target> hat deine Anfrage angenommen."
    accepted-paid: "<prefix><green><target> hat deine Anfrage angenommen. <dark_gray>(-<price>)"
    accepted-target: "<prefix><green>Anfrage von <white><requester></white> angenommen."
    denied: "<prefix><red><target> hat deine Anfrage abgelehnt."
    denied-target: "<prefix><gray>Anfrage von <white><requester></white> abgelehnt."
    no-request: "<prefix><red>Keine offene Teleport-Anfrage."
    not-found: "<prefix><red><target> ist nicht online."
    self: "<prefix><red>Du kannst dir selbst keine Anfrage schicken."
    not-enough: "<prefix><red>Du brauchst <white><price></white> für eine Teleport-Anfrage."
    requester-cannot-pay: "<prefix><red><requester> kann <price> nicht mehr bezahlen – Teleport abgebrochen."
    failed: "<prefix><red>Teleport fehlgeschlagen."

# ------------------------------------------------------------
# News (/news, /news read <id>, /newsadmin – auch im Admin-Panel unter "Server")
# News selbst werden im Admin-Panel bearbeitet und in news.yml gespeichert.
# Platzhalter: <id>, <title>, <priority>, <date>, <short>, im Feed zusätzlich <count>, <new>
# ------------------------------------------------------------
news:
  show-on-join: true
  join-delay-seconds: 3
  priorities:
    1: "<gray>Info"
    2: "<yellow>Normal"
    3: "<red>Wichtig"
    4: "<dark_red><bold>DRINGEND</bold>"
  feed:
    header: "<dark_gray>────── <gold><bold>✉ News</bold></gold> <gray>(<count>)</gray> <dark_gray>– <gray>Klicke zum Lesen</gray> ──────"
    entry: "<click:run_command:'/news read <id>'><hover:show_text:'<gray>Klicke, um die ganze Nachricht zu lesen'> <new><dark_gray>[</dark_gray><priority><dark_gray>]</dark_gray> <white><bold><title></bold></white> <dark_gray>»</dark_gray> <gray><short></hover></click>"
    new: "<green><bold>NEU</bold></green> "
    footer: "<dark_gray>──────────────────────────────"
  read:
    header: "<dark_gray>──────</dark_gray> <priority> <dark_gray>|</dark_gray> <white><bold><title></bold></white>"
    date: "<gray>Veröffentlicht am <white><date>"
    footer: "<click:run_command:'/news'><hover:show_text:'<gray>Zurück zur Übersicht'><dark_gray>[<gray>« Alle News</gray>]</dark_gray></hover></click>"
  messages:
    none: "<prefix><gray>Aktuell gibt es keine News."
    not-available: "<prefix><red>Diese News ist nicht verfügbar."
    not-found: "<prefix><red>Diese News existiert nicht."
    saved: "<prefix><green>Gespeichert."
    cancelled: "<prefix><gray>Eingabe abgebrochen."
    deleted: "<prefix><red>News Nr. <id> wurde gelöscht."
    delete-hint: "<prefix><gray>Zum Löschen <red>Shift + Klick</red> benutzen."
    back-to-editor: "<click:run_command:'/newsadmin edit <id>'><hover:show_text:'<gray>Zurück zum Editor'><dark_gray>[<yellow>« Zurück zum Editor</yellow>]</dark_gray></hover></click>"
    invalid-duration: "<prefix><red>Ungültige Zeitangabe. Beispiele: <white>2h</white>, <white>7 Tage</white>, <white>1d 12h</white>. Versuch es nochmal:"
    prompt-title: "<prefix><gray>Gib den neuen <white>Titel</white> im Chat ein. <click:run_command:'/newsadmin cancel'><red>[Abbrechen]</red></click> <dark_gray>(oder <gray>abbrechen</gray> schreiben)"
    prompt-content: "<prefix><gray>Gib den neuen <white>Inhalt</white> im Chat ein.<newline><dark_gray> - <gray>Klickbarer Befehl: <white>[Alle News](/news)</white><newline><dark_gray> - <gray>Zeilenumbruch: <white>\\n</white> <dark_gray>| <gray>Farben: <white>&-Codes</white> oder <white>MiniMessage</white><newline><click:run_command:'/newsadmin cancel'><red>[Abbrechen]</red></click> <dark_gray>(oder <gray>abbrechen</gray> schreiben)"
    prompt-append: "<prefix><gray>Gib den <white>anzuhängenden Text</white> im Chat ein. <click:run_command:'/newsadmin cancel'><red>[Abbrechen]</red></click> <dark_gray>(oder <gray>abbrechen</gray> schreiben)"
    prompt-start: "<prefix><gray>In wie viel Zeit soll die News <white>starten</white>? Z.B. <white>2h</white>, <white>1 Tag</white>. <click:run_command:'/newsadmin cancel'><red>[Abbrechen]</red></click>"
    prompt-end: "<prefix><gray>Wie lange soll die News <white>laufen</white> (ab Start)? Z.B. <white>7 Tage</white>. <click:run_command:'/newsadmin cancel'><red>[Abbrechen]</red></click>"

# ------------------------------------------------------------
# Reports (/report <spieler> <grund>, /reports, /clearreports)
# Zusätzliche Platzhalter: <id>, <target>, <reporter>, <reason>
# ------------------------------------------------------------
reports:
  # Sekunden zwischen zwei /report eines Spielers (Bypass: sess.report.bypasscooldown)
  cooldown: 30
  messages:
    sent: "<prefix><green>Deine Meldung wurde übermittelt! <gray>(ID #<id>)"
    self: "<prefix><red>Du kannst dich nicht selbst melden!"
    unknown-player: "<prefix><red>Der Spieler <white><target></white> war noch nie auf dem Server."
    cooldown: "<prefix><red>Warte noch <time> Sekunde(n), bevor du erneut meldest."
    notify: "<prefix><yellow><reporter></yellow><gray> hat <yellow><target></yellow> gemeldet <dark_gray>(#<id>)</dark_gray>: <white><reason>"
    teleported: "<prefix><green>Du wurdest zu <target> teleportiert."
    offline: "<prefix><red><target> ist gerade nicht online."
    resolved: "<prefix><green>Report #<id> wurde als erledigt markiert."
    deleted: "<prefix><red>Report #<id> wurde gelöscht."
    gone: "<prefix><red>Dieser Report existiert nicht mehr."
    cleared: "<prefix><green><count> offene Report(s) wurden gelöscht."

# ------------------------------------------------------------
# Client-Detector
# Erkennt beim Join den Client über Brand und Plugin-Channels.
# Hack-Clients nur über Signaturen – getarnte Clients (Brand "vanilla"/"fabric") fallen nicht auf.
# Wer was gemeldet bekommt, stellt jeder Admin im Admin-Panel unter "Benachrichtigungen" ein.
# Platzhalter: <client>, <channels>, <match>, <id> (Meldung im Admin-Panel)
# ------------------------------------------------------------
client-detector:
  enabled: true
  # Wartezeit nach dem Join in Ticks (20 = 1 Sekunde), bis alle Channels registriert sind
  check-delay-ticks: 40
  # true = auch für Mod-Clients (Fabric, Forge, Lunar, ...) eine Meldung im Admin-Panel anlegen
  report-modded: false
  # Treffer = Hack-Client. Geprüft wird, ob Brand oder ein Channel den Text enthält (Groß-/Kleinschreibung egal).
  hack-signatures:
    - wurst
    - meteor
    - aristois
    - liquidbounce
    - rusherhack
    - futureclient
    - inertia
    - konas
    - salhack
    - bleachhack
    - thunderhack
    - phobos
    - 3arthh4ck
  messages:
    vanilla: "<prefix><gray><player> ist mit <green>Vanilla</green> gejoint."
    modded: "<prefix><gray><player> ist mit <yellow><client></yellow> gejoint. <dark_gray>[<hover:show_text:'<gray>Channels:<newline><white><channels>'>Channels</hover>]"
    hack: "<prefix><red><bold>Hack-Client:</bold></red> <white><player></white> <gray>(<client>, Treffer: <red><match></red><gray>) – Meldung #<id> im Admin-Panel."

# ------------------------------------------------------------
# Admin-Panel (/admin)
# Kacheln erscheinen nur mit dem Recht der jeweiligen Anwendung.
# ------------------------------------------------------------
admin:
  title: "<dark_gray>Admin-Panel"

# ------------------------------------------------------------
# TAB-Liste
# ------------------------------------------------------------
tab:
  enabled: true
  update-interval-ticks: 40
  header:
    - ""
    - "<gradient:#00c6ff:#0072ff><bold>MEIN SERVER</bold></gradient>"
    - "<gray>Online: <white><online></white>/<white><max_players></white>"
    - ""
  footer:
    - ""
    - "<gray>Viel Spaß, <white><player></white>!"
    - ""
  # Anzeige des Spielers in der TAB-Liste.
  # Leer lassen (""), damit Prefix/Suffix aus "nametag" auch im TAB genutzt werden.
  player-format: "<lp_prefix><player><lp_suffix>"

# ------------------------------------------------------------
# Nametags (über dem Kopf, nutzt Scoreboard-Teams)
# Die Teams sortieren die TAB-Liste: kleinere priority = weiter oben.
# ------------------------------------------------------------
nametag:
  enabled: true
  default:
    priority: 99
    prefix: "<lp_prefix>"
    suffix: "<lp_suffix>"
    name-color: white     # Farbe des Namens (Vanilla-Farbname)
  groups:
    admin:
      priority: 1
      prefix: "<red>[Admin] "
      suffix: ""
      name-color: red
