# ============================================================
#  SEssentials – Konfiguration
#  Alle Texte unterstützen MiniMessage (https://webui.advntr.dev/)
#  und zusätzlich &-Farbcodes (z.B. aus LuckPerms-Prefixen).
#
#  Aufbau: diese Datei (global: Sprache, Prefix, Module), config/<modul>.yml (Einstellungen
#  je Modul, z.B. trust.yml, clans.yml) und lang/<sprache>.yml (alle Texte).
#
#  Verfügbare Platzhalter (überall, wo ein Spieler im Kontext ist):
#    <player>          Spielername
#    <displayname>     Anzeigename
#    <world>           Welt des Spielers
#    <online>          Spieler online
#    <max_players>     Maximale Spieler
#    <lp_prefix>       LuckPerms-Prefix
#    <lp_suffix>       LuckPerms-Suffix
#    <lp_group>        LuckPerms-Primärgruppe
#    <lp_meta:KEY>     LuckPerms-Meta-Wert (z.B. <lp_meta:color>)
#    <papi:NAME>       PlaceholderAPI-Platzhalter, z.B. <papi:luckperms_prefix>
#    %NAME%            PlaceholderAPI-Platzhalter in klassischer Schreibweise
# ============================================================

# Sprache der Texte = Dateiname in lang/ ohne .yml. Mitgeliefert: de_DE (Deutsch), en_US (English).
# Eigene Sprache: z.B. lang/fr_FR.yml anlegen (fehlende Texte kommen aus en_US) und hier eintragen.
language: de_DE
prefix: "<dark_gray>[<gradient:#00c6ff:#0072ff>SEssentials</gradient>]</dark_gray> "

# ------------------------------------------------------------
# Module – jedes Feature einzeln an (true) oder aus (false). Ausgeschaltete Module haben keine Befehle,
# keine Kachel im Admin-Panel und laufen nicht im Hintergrund; ihre gespeicherten Daten bleiben erhalten.
# Änderungen gelten nach einem Neustart. Glücksrad und Chestshops brauchen die Bank.
# Kosten in Geld (spawn.cost, tpa.cost, …) buchen auch ohne Bank-Modul vom Konto ab – dann besser
# type: item oder amount: 0 nutzen.
# ------------------------------------------------------------
modules:
  admin-panel: true      # /admin
  chat: true             # Chatformat
  join-quit: true        # Join-/Quit-Nachrichten
  tab: true              # TAB-Liste und Nametags
  vanish: true           # /vanish
  help: true             # /help als Menü
  command-aliases: true  # eigene Befehle (command-aliases)
  player-commands: true  # /fly, /god, /heal, /feed
  sudo: true             # /sudo
  enderchest: true       # /enderchest, /ec
  spawn: true            # /spawn, /setspawn
  dimensions: true       # /nether, /end
  tpa: true              # /tpa, /tpaccept, /tpdeny
  messages: true         # /msg, /r
  mail: true             # /mail
  spy: true              # /socialspy
  bank: true             # /bank, /balance, /pay, /baltop, /eco, Vault
  chestshops: true       # Chestshops, /shop
  bounty: true           # Kopfgeld (/kopfgeld)
  clans: true            # Clans (/clan), Platzhalter <clan>
  gambling: true         # Glücksrad (/gluecksrad)
  upgrader: true         # Item-Upgrader (/upgrader)
  item-tracker: true     # Item-Tracker im Admin-Panel
  punishments: true      # /ban, /mute, /ipban, /history, …
  fairplay: true         # Fairplay-Punkte, Combat-Log, /fairplay
  reports: true          # /report, /reports
  itemguard: true        # ItemGuard (verbotene Items)
  creativelog: true      # CreativeLog
  trust: true            # Schutz vor neuen Spielern, /trust
  client-detector: true  # Client-Detector
  news: true             # /news
  softrestart: true      # /softrestart
  auto-update: true      # /autoupdate (das Update selbst steuert auto-update.enabled)
  fake-players: true     # /fakeplayer
  webpanel: true         # Webpanel und /webpanel

# ------------------------------------------------------------
# Softrestart
# ------------------------------------------------------------
softrestart:
  # Sekunden vor dem Neustart, bei denen alle Spieler informiert werden
  announce-at: [3600, 1800, 900, 600, 300, 120, 60, 30, 15, 10, 5, 4, 3, 2, 1]
  # Zusätzlich einen Titel ab dieser Restzeit (Sekunden) anzeigen, 0 = aus
  title-below: 10
  bossbar:
    enabled: true
    color: RED            # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
  # Befehl, der nach Kick + Speichern über die Konsole ausgeführt wird.
  # "restart" nutzt das restart-script aus spigot.yml, "stop" fährt nur herunter.
  final-command: "restart"

# ------------------------------------------------------------
# Chat
# ------------------------------------------------------------
chat:
  enabled: true
  # <message> = die Nachricht des Spielers
  default-format: "<clan><lp_prefix><gray><player></gray><lp_suffix> <dark_gray>»</dark_gray> <white><message>"
  # Eigene Formate pro LuckPerms-Primärgruppe
  group-formats:
    admin: "<lp_prefix><red><hover:show_text:'<gray>Gruppe: <lp_group>'><player></hover></red> <dark_gray>»</dark_gray> <white><message>"
    # vip: "<gold>[VIP] <player> <dark_gray>»</dark_gray> <yellow><message>"

# ------------------------------------------------------------
# Join- / Leave-Nachrichten
# Leer lassen (""), um die Nachricht komplett auszublenden.
# enabled: false = Vanilla-Nachrichten bleiben unverändert.
# ------------------------------------------------------------
join-quit:
  enabled: true
  join: "<dark_gray>[<green>+</green>]</dark_gray> <lp_prefix><gray><player></gray>"
  quit: "<dark_gray>[<red>-</red>]</dark_gray> <lp_prefix><gray><player></gray>"

# ------------------------------------------------------------
# Vanish (/vanish, Alias /v)
# Versteckte Spieler sind für alle ohne sess.vanish.see unsichtbar (Welt, TAB, Commands,
# Serverliste, <online>). Sie können nicht chatten, bauen, abbauen, schlagen oder einsammeln.
# Beim Ein-/Ausblenden wird eine Fake-Leave/Join-Nachricht (Texte aus join-quit) gesendet.
# ------------------------------------------------------------
vanish:
  # false = beim Ein-/Ausblenden nie Fake-Nachrichten senden
  # Einzeln im Spiel: /vanish silent schaltet ohne Fake-Nachricht um
  fake-messages: true
  # Mindestabstand in Sekunden zwischen zwei Fake-Nachrichten eines Spielers (gegen Spam)
  fake-message-cooldown: 60
  # Was im Vanish blockiert wird (true = blockiert).
  # Einzeln im Spiel: /vanish bypass (Recht sess.vanish.bypass) hebt alle Schutzregeln auf
  protections:
    pickup: true
    chat: true
    break: true
    place: true
    damage: true

# ------------------------------------------------------------
# Befehls-Aliase: eigene Befehle, die andere Befehle ausführen.
#   alias: "befehl"                       ein Befehl
#   alias: ["befehl 1", "befehl 2"]       mehrere Befehle nacheinander
#   alias:                                mit Recht und Beschreibung (für /help)
#     commands: ["befehl"]
#     permission: sess.alias.beispiel     leer = jeder (die Rechte der ausgeführten Befehle gelten trotzdem)
#     description: "Was der Befehl tut"
# Platzhalter: $1, $2, … = Argumente, $1- = ab dem 1. Argument alles, <player> = wer den Alias nutzt.
# Spieler führen die Befehle wie selbst getippt aus (eigene Rechte, Mute-Sperren). "console:" vor einem
# Befehl lässt ihn die Konsole ausführen – dann sind als Argumente nur einfache Wörter erlaubt (kein @a).
# Ein Alias darf keinen anderen Alias aufrufen (sonst wären Endlosschleifen möglich).
# Neue oder gelöschte Aliase gelten nach einem Neustart, geänderte Befehle schon nach /sessentials reload.
# Beispiele:
#   gmc: "gamemode creative $1-"
#   gms: "gamemode survival $1-"
#   discord:
#     commands: ["console:tellraw <player> {\"text\":\"discord.gg/deinserver\",\"color\":\"aqua\"}"]
#     description: "Zeigt den Discord-Link"
# ------------------------------------------------------------
command-aliases: {}

# ------------------------------------------------------------
# Hilfe (/help, Alias /?) – ersetzt die Vanilla-Hilfe durch ein Menü. Die Konsole bekommt sie als Text.
# Kategorien erscheinen als Kacheln, darin die Befehle. Pro Befehl:
#   command: der Befehl            name / description: Anzeige (MiniMessage)     icon: Item, z.B. ENDER_PEARL
#   click: run = beim Klick ausführen, suggest = zum Ergänzen in den Chat schreiben (Standard),
#          url = Link anzeigen (dazu url: "https://…"), none = nur Info
#   permission: nur mit diesem Recht sichtbar (auch für ganze Kategorien)
# Kategorien oder Einträge ohne sichtbaren Befehl werden ausgeblendet.
# ------------------------------------------------------------
help:
  categories:
    allgemein:
      name: "<gold><bold>Allgemein"
      icon: COMPASS
      description: ["<gray>Spawn, Nachrichten, Teleport"]
      commands:
        - {command: "/spawn", name: "<gold>/spawn", description: "<gray>Zum Spawn teleportieren", icon: ENDER_PEARL, click: run}
        - {command: "/news", name: "<gold>/news", description: "<gray>Aktuelle Neuigkeiten", icon: OAK_SIGN, click: run}
        - {command: "/msg", name: "<gold>/msg <spieler> <text>", description: "<gray>Private Nachricht, /r antwortet", icon: PAPER}
        - {command: "/mail send", name: "<gold>/mail send <spieler> <text>", description: "<gray>Nachricht für offline Spieler", icon: WRITABLE_BOOK}
        - {command: "/mail", name: "<gold>/mail", description: "<gray>Deine Mails lesen", icon: BOOK, click: run}
        - {command: "/tpa", name: "<gold>/tpa <spieler>", description: "<gray>Teleport-Anfrage senden", icon: COMPASS}
        - {command: "/ec", name: "<gold>/ec", description: "<gray>Enderchest öffnen", icon: ENDER_CHEST, click: run}
        - {command: "/report", name: "<gold>/report <spieler> <grund>", description: "<gray>Spieler melden", icon: BELL}
        - {name: "<aqua>Discord", description: "<gray>discord.gg/DEIN-LINK", icon: AMETHYST_SHARD, click: url, url: "https://discord.gg/DEIN-LINK"}
    wirtschaft:
      name: "<yellow><bold>Wirtschaft"
      icon: GOLD_INGOT
      description: ["<gray>Bank, Shops, Glücksspiel"]
      commands:
        - {command: "/bank", name: "<gold>/bank", description: "<gray>Einzahlen, Kontostand, Auszahlen", icon: GOLD_BLOCK, click: run}
        - {command: "/pay", name: "<gold>/pay <spieler> <betrag>", description: "<gray>Geld überweisen", icon: GOLD_NUGGET}
        - {command: "/baltop", name: "<gold>/baltop", description: "<gray>Die reichsten Spieler", icon: DIAMOND, click: run}
        - {command: "/clan", name: "<gold>/clan", description: "<gray>Dein Clan: Home, Truhe, Clan-Konto", icon: WHITE_BANNER, click: run}
        - {command: "/kopfgeld", name: "<gold>/kopfgeld [spieler betrag]", description: "<gray>Kopfgeld aussetzen bzw. anzeigen", icon: SKELETON_SKULL}
        - {command: "/shop", name: "<gold>/shop", description: "<gray>Chestshop erstellen (auf eine Kiste schauen)", icon: CHEST, click: run}
        - {command: "/gluecksrad", name: "<gold>/gluecksrad", description: "<gray>Glücksrad drehen", icon: CLOCK, click: run}
        - {command: "/upgrader", name: "<gold>/upgrader", description: "<gray>Items upgraden – mit Risiko", icon: SMITHING_TABLE, click: run}
    team:
      name: "<red><bold>Team"
      icon: NETHER_STAR
      description: ["<gray>Befehle für das Team"]
      commands:
        - {command: "/admin", name: "<red>/admin", description: "<gray>Admin-Panel", icon: COMMAND_BLOCK, click: run, permission: sess.admin}
        - {command: "/vanish", name: "<red>/vanish", description: "<gray>Unsichtbar ein/aus", icon: ENDER_EYE, click: run, permission: sess.vanish}
        - {command: "/reports", name: "<red>/reports", description: "<gray>Offene Reports", icon: WRITABLE_BOOK, click: run, permission: sess.reports.admin}
        - {command: "/socialspy", name: "<red>/socialspy", description: "<gray>/msg und /mail mitlesen", icon: SPYGLASS, click: run, permission: sess.spy}
        - {command: "/fly", name: "<red>/fly, /god, /heal, /feed", description: "<gray>Spieler-Befehle", icon: FEATHER, permission: sess.fly}
        - {command: "/fp", name: "<red>/fp", description: "<gray>Fake-Spieler verwalten", icon: ARMOR_STAND, permission: sess.fakeplayer}

# ------------------------------------------------------------
# Teleport-Wartezeit für /spawn, /tpa (der Anfragende nach Annahme), /nether, /end und /clan home.
# Der Teleport startet erst, wenn man so lange stillsteht und keinen Schaden nimmt. Kosten werden erst
# beim Teleport abgezogen – ein Abbruch kostet nichts. Mit sess.teleport.nowarmup sofort.
# Admin-Teleports (Admin-Panel, Reports) und Join/Respawn sind nie betroffen.
# ------------------------------------------------------------
teleport-warmup:
  seconds: 3                  # 0 = sofort
  cancel-on-move: true        # Abbruch beim Verlassen des Blocks (Umsehen ist erlaubt)
  move-tolerance-blocks: 0    # so viele Blöcke darf man sich entfernen (0 = Block nicht verlassen)
  cancel-on-damage: true      # Abbruch bei jedem Schaden
  # Eigene Wartezeit pro Teleport (fehlt ein Eintrag, gilt seconds)
  per-teleport:
    spawn: 3
    tpa: 3
    nether: 3
    end: 3
    clan-home: 5

# ------------------------------------------------------------
# Spawn (/spawn, /setspawn)
# Mit sess.spawn ist /spawn kostenlos, sonst kostet es den Betrag unten (Konto oder Items).
# Platzhalter in den Kosten-Texten: <price>, <amount>, <item>
# Neue Spieler und Respawns ohne Bett/Anker landen exakt am gesetzten Spawn.
# ------------------------------------------------------------
spawn:
  cost:
    type: money       # money = vom Bankkonto, item = in Items
    amount: 500       # Betrag bzw. Anzahl Items; 0 = kostenlos für alle
    item: DIAMOND     # nur bei type: item, z.B. DIAMOND, EMERALD, GOLD_INGOT

# ------------------------------------------------------------
# Bank (/bank, /balance, /pay, /baltop, /eco)
# Spieler zahlen Items auf ein digitales Konto ein und bezahlen damit Befehle, andere Spieler
# und – mit Vault – andere Plugins (Shops usw.). Beträge sind ganze Einheiten.
# Platzhalter: <amount>, <balance>, <target>, <sender>, <rank>, <name>
# ------------------------------------------------------------
bank:
  currency:
    singular: "Taler"
    plural: "Taler"
  start-balance: 0
  # Einzahlbare Materialien mit Wert pro Item. Das erste ist das Basis-Material.
  materials:
    DIAMOND: 100
    NETHERITE_INGOT: 1000
    EMERALD: 50
    IRON_INGOT: 5
  # false = nur das Basis-Material (erstes oben) zählt
  multiple-materials: true
  # true = auch die Blöcke (z.B. Diamantblock = 9 Diamanten) ein- und auszahlen
  allow-blocks: true
  withdraw:
    enabled: true
    # original = in den Materialien oben (größte Werte zuerst), base = nur im Basis-Material
    mode: original
    # Schnell-Buttons im /bank-Menü
    presets: [100, 1000, 6400]

# ------------------------------------------------------------
# Item-Tracker (Admin-Panel → Wirtschaft → Item-Tracker, Recht sess.tracker)
# Zählt wertvolle Items in Inventar und Enderchest (inkl. Shulkerkisten darin) beim Join, beim Verlassen
# und regelmäßig. Verlauf: 24 h vollständig, bis 7 Tage stündlich, danach täglich. Werte nach bank.materials.
# ------------------------------------------------------------
tracker:
  enabled: true
  interval-minutes: 10
  history-days: 30
  include-shulkers: true
  # Höchstens 18 werden im Menü angezeigt
  items:
    - DIAMOND
    - DIAMOND_BLOCK
    - NETHERITE_INGOT
    - NETHERITE_BLOCK
    - NETHERITE_SCRAP
    - ANCIENT_DEBRIS
    - EMERALD
    - EMERALD_BLOCK
    - GOLD_INGOT
    - GOLD_BLOCK
    - IRON_INGOT
    - IRON_BLOCK
    - ENCHANTED_GOLDEN_APPLE
    - TOTEM_OF_UNDYING
    - ELYTRA
    - BEACON

# ------------------------------------------------------------
# /enderchest (Alias /ec) – öffnet die eigene Enderchest. Mit sess.enderchest.free kostenlos.
# Platzhalter: <price> (z.B. "50 Taler" oder "1x Diamant"), <amount>, <item>
# ------------------------------------------------------------
enderchest:
  cost:
    type: money       # money = vom Bankkonto, item = in Items
    amount: 50        # Betrag bzw. Anzahl Items; 0 = kostenlos für alle
    item: DIAMOND     # nur bei type: item

# ------------------------------------------------------------
# Glücksrad (/gluecksrad, Alias /gamble)
# Einsatz in Bank-Währung einstellen und drehen. Einsätze, die Gebühr unten und alle Zahlungen an den
# Server (Kosten von /tpa, /spawn, /ec, Käufe in Admin-Shops; Item-Kosten mit ihrem Bank-Kurs) fließen
# in den Topf; Gewinne werden aus dem Topf bezahlt. Gedreht werden kann nur, wenn der Topf den höchsten
# möglichen Gewinn deckt. Topf ansehen: /gluecksrad topf, setzen: /gluecksrad topf setzen <betrag>
# oder im Admin-Panel (Wirtschaft → Glücksrad, Recht sess.gamble.admin)
# Platzhalter: <amount>, <stake>, <multiplier>, <pot>, <price>, <winner> (nur jackpot-broadcast)
# ------------------------------------------------------------
gambling:
  min-bet: 10
  max-bet: 100000
  # Gebühr pro Dreh, zusätzlich zum Einsatz
  fee:
    type: money       # money = vom Bankkonto, item = in Items
    amount: 5         # 0 = keine Gebühr
    item: DIAMOND     # nur bei type: item
  # Felder des Rads: multiplier = Gewinn als Vielfaches des Einsatzes (0 = verloren),
  # jackpot: true = Gewinn ist der ganze Topf (danach ist der Topf leer),
  # weight = Gewichtung; Wahrscheinlichkeit = weight / Summe aller weights (hier 100 = Prozent) – Standard für alle Spieler
  segments:
    - {multiplier: 0, weight: 44}
    - {multiplier: 0.5, weight: 20}
    - {multiplier: 1, weight: 15}
    - {multiplier: 1.5, weight: 10}
    - {multiplier: 2, weight: 7}
    - {multiplier: 5, weight: 2}
    - {multiplier: 10, weight: 1}
    - {jackpot: true, weight: 1}
  # Spieler sehen keine Chancen. Eigene Gewichte pro Spieler: Webpanel → Glücksrad (Recht sess.gamble.admin).
  # Anlauf: Felder ab high-multiplier und der Jackpot haben zu Beginn einer Sitzung nur min-factor ihrer
  # Gewichtung und erreichen die volle erst nach full-after-spins Drehungen UND full-after-staked Einsatz.
  # Eine Sitzung endet nach session-timeout-minutes ohne Drehung oder beim Verlassen des Servers.
  warmup:
    enabled: true
    high-multiplier: 2
    min-factor: 0.25
    full-after-spins: 10
    full-after-staked: 1000
    session-timeout-minutes: 30

# ------------------------------------------------------------
# Mail (/mail send <spieler> <nachricht>, /mail [read], /mail delete <nr>, /mail clear)
# Nachrichten an Spieler, die schon einmal auf dem Server waren – auch wenn sie offline sind.
# Beim Join erfährt der Empfänger von ungelesenen Mails. Gemutete Spieler können keine Mails senden.
# Platzhalter: <sender>, <target>, <message> (immer reiner Text), <count>, <number>, <time>, <max>
# ------------------------------------------------------------
mail:
  max-per-inbox: 50
  max-length: 256

# ------------------------------------------------------------
# Teleport-Anfragen (/tpa <spieler>, /tpaccept [spieler], /tpdeny [spieler])
# Der Anfragende zahlt erst, wenn die Anfrage angenommen wird. Mit sess.tpa.free kostenlos.
# Platzhalter: <requester>, <target>, <seconds>, <price> (z.B. "500 Taler" oder "5x Diamant"), <amount>, <item>
# ------------------------------------------------------------
tpa:
  expire-seconds: 60
  cost:
    type: money       # money = vom Bankkonto, item = in Items
    amount: 500       # Betrag bzw. Anzahl Items; 0 = kostenlos für alle
    item: DIAMOND     # nur bei type: item

# ------------------------------------------------------------
# Kopfgeld (/kopfgeld <spieler> <betrag>, /kopfgeld zeigt die höchsten; Alias /bounty)
# Der Betrag wird sofort vom Bankkonto abgebucht. Wer das Ziel tötet, bekommt alle Kopfgelder,
# die er nicht selbst ausgesetzt hat, plus das Inventar des Opfers. Gespeichert in bounties.yml.
# Admins (sess.bounty.admin) verwalten Kopfgelder im Admin-Panel oder mit /kopfgeld entfernen <spieler>.
# Entfernte und abgelaufene Kopfgelder gehen an den Aussetzenden zurück.
# Platzhalter: <setter>, <killer>, <target>, <amount>, <total>, <rank>, <duration>
# ------------------------------------------------------------
bounty:
  # Wie lange ein Kopfgeld gilt, z.B. 12h, 3d, 1w – 0 = unbegrenzt. Nachlegen startet die Zeit neu.
  max-duration: 0

# ------------------------------------------------------------
# Clans (/clan) – Kosten-Format wie bei spawn.cost (type money = Bankkonto, item = Items, amount 0 = kostenlos).
# Befehle: erstellen <name> <farbe>, farbe, einladen, annehmen, ablehnen, verlassen, kicken, leiter,
#          aufloesen, info [clan], liste, home, home vorschlagen, abstimmen ja|nein,
#          truhe, truhe kaufen, bank, einzahlen, auszahlen, friendlyfire an|aus, admin aufloesen <clan> (sess.clan.admin)
# Der Platzhalter <clan> (Clan-Tag nach tag-format) funktioniert in Chat, TAB, Nametags usw.
# Gespeichert in clans.yml. Einladungen und Home-Abstimmungen verfallen bei einem Neustart.
# ------------------------------------------------------------
clans:
  create-cost:
    type: money
    amount: 10000
    item: DIAMOND
  name:
    min-length: 3
    max-length: 12
  max-members: 10             # 0 = unbegrenzt
  invite-expire-seconds: 120
  # Erlaubte Farben für /clan erstellen und /clan farbe (Minecraft-Farbnamen)
  colors: [red, dark_red, gold, yellow, green, dark_green, aqua, dark_aqua, blue, dark_blue, light_purple, dark_purple, white, gray]
  # Clan-Tag für <clan>; <name> = farbiger Clan-Name. Bleibt leer, solange luckperms-tag aktiv ist
  # (der Tag kommt dann über <lp_suffix> bzw. <lp_prefix>, sonst stünde er doppelt da).
  tag-format: "<dark_gray>[<name><dark_gray>]</dark_gray> "
  # Clan-Tag als echter LuckPerms-Suffix (oder -Prefix) direkt am Spieler – sichtbar für alle Plugins, die LuckPerms lesen.
  # Wird beim Beitreten/Verlassen/Auflösen, Farbwechsel, Join und Reload aktualisiert. Ohne LuckPerms ohne Wirkung.
  # LuckPerms zeigt ohne Meta-Stacking nur den Eintrag mit der höchsten Priorität. Damit Clan-Tag UND Gruppen-Suffix
  # erscheinen, in der LuckPerms-config.yml: meta-formatting → suffix → format: ["highest_own", "highest_inherited"]
  luckperms-tag:
    enabled: true
    type: suffix              # suffix oder prefix; beim Wechsel räumt SEssentials die alten Einträge ab
    priority: 1000            # reserviert – SEssentials entfernt alle Einträge dieser Art mit dieser Priorität
    format: " &8[<color><name>&8]"   # & -Farbcodes; <color> = Clan-Farbe, <name> = Clan-Name
  # true = nur der Leiter darf das, false = alle Mitglieder (kicken, Leiter, Farbe, Auflösen: immer nur der Leiter)
  leader-only:
    invite: true
    propose-home: false
    buy-chest: true
    withdraw: true
    friendly-fire: true
  # Friendly Fire für neue Clans (true = Mitglieder können sich schaden); jeder Clan stellt es mit /clan friendlyfire an|aus um
  friendly-fire-default: false
  home:
    # Mehr als so viel Prozent aller Mitglieder müssen mit Ja stimmen (50 = einfache Mehrheit)
    vote-percent: 50
    vote-minutes: 10
    cost:                     # pro /clan home
      type: money
      amount: 250
      item: DIAMOND
  chest:
    price: 5000               # einmalig, vom Clan-Konto
    rows: 3                   # 1–6; Verkleinern löscht keine Items
    max-distance-from-home: 16
    remote-enabled: true      # /clan truhe von überall
    remote-deposit: false     # false = aus der Ferne nur entnehmen, nicht einlagern
    remote-cost:              # pro /clan truhe aus der Ferne; am Block ist es kostenlos
      type: money
      amount: 100
      item: DIAMOND

# ------------------------------------------------------------
# News (/news, /news read <id>, /newsadmin – auch im Admin-Panel unter "Server")
# News selbst werden im Admin-Panel bearbeitet und in news.yml gespeichert.
# Platzhalter: <id>, <title>, <priority>, <date>, <short>, im Feed zusätzlich <count>, <new>
# ------------------------------------------------------------
news:
  show-on-join: true
  join-delay-seconds: 3

# ------------------------------------------------------------
# Reports (/report <spieler> <grund>, /reports, /clearreports)
# Zusätzliche Platzhalter: <id>, <target>, <reporter>, <reason>
# ------------------------------------------------------------
reports:
  # Sekunden zwischen zwei /report eines Spielers (Bypass: sess.report.bypasscooldown)
  cooldown: 30

# ------------------------------------------------------------
# Webpanel – Statistiken aus dem Admin-Panel im Browser (nur lesend, ohne IP-Adressen).
# Login: im Spiel /webpanel → persönlicher Einmal-Link (5 Minuten gültig), danach Sitzung per Cookie.
# Läuft über HTTP ohne Verschlüsselung – für Zugriff von außen am besten hinter einen Reverse-Proxy mit HTTPS
# (z.B. Caddy/nginx) stellen und public-url auf dessen Adresse setzen.
# ------------------------------------------------------------
webpanel:
  enabled: true
  bind: "0.0.0.0"          # 127.0.0.1 = nur lokal erreichbar
  port: 8085               # muss beim Hoster freigegeben sein
  public-url: ""           # Adresse in Login-Links, z.B. https://panel.meinserver.de (leer = http://<server-ip>:<port>)
  session-hours: 12
  refresh-seconds: 30

# ------------------------------------------------------------
# Fairplay (/fairplay [spieler], /fairplay top, /fairplay reset <spieler>)
# Jeder startet mit start-score Punkten. Verstöße kosten Punkte; bei strike-threshold oder weniger gibt es einen
# Strike und der Stand beginnt wieder bei start-score. Bei strikes-for-punishment aktiven Strikes wird die
# Strafvorlage punishment-template (siehe punishments.templates) vergeben und die Strikes verfallen.
# Wer fair spielt, bekommt alle recovery.interval-minutes recovery.points zurück (nur online, höchstens bis start-score).
# sess.fairplay.exempt = keine Verstöße, sess.fairplay.notify = Meldungen fürs Team. Gespeichert in fairplay.yml.
# Platzhalter: <target>, <score>, <max>, <strikes>, <strikes_max>, <threshold>, <violation>, <points>, <fine>, <victim>, <rank>
# ------------------------------------------------------------
fairplay:
  start-score: 100
  strike-threshold: 50
  strikes-for-punishment: 3     # 0 = nie bestrafen
  strike-expire-days: 30        # 0 = Strikes verfallen nie
  punishment-template: "8"      # "" = keine Strafe, nur Strikes
  # Geldstrafen gehen vom Bankkonto in den Server-Topf – höchstens so viel, wie auf dem Konto ist (nie ins Minus)
  strike-fine: 1000             # zusätzlich bei jedem Strike; 0 = keine
  strike-name: "Strike"         # Anzeige im Verlauf
  recovery:
    interval-minutes: 30
    points: 5
  # Combat-Log: wer nach einem PvP-Treffer (als Angreifer oder Opfer) so lange den Server verlässt
  combat-tag-seconds: 15        # 0 = kein Combat-Log
  combat-log-kill: true         # Combat-Logger sterben beim Verlassen (Items fallen wie bei einem Tod)
  count-timeouts: false         # true = auch Verbindungsabbrüche (Timeout) zählen; Kicks zählen nie
  # Punkte und Geldstrafe pro Verstoß; points und fine beide 0 = Verstoß aus
  violations:
    combat-log:
      name: "Combat-Log"
      points: 25
      fine: 500
    spawn-kill:
      name: "Spawn-Kill"
      points: 15
      fine: 250
      seconds: 10               # Kill innerhalb so vieler Sekunden nach dem Respawn des Opfers
    kill-farming:
      name: "Kill-Farming"
      points: 20
      fine: 250
      kills: 3                  # so oft denselben Spieler töten …
      minutes: 10               # … innerhalb dieser Zeit

# ------------------------------------------------------------
# Strafen: Bans, Mutes, IP-Bans – frei (/ban, /mute, /ipban <spieler> [dauer|perm] [grund])
# oder nach Vorlage (/punish <spieler> <id>). Dauer z.B. 30m, 2h, 7d, 1d12h, 1mo, 1y; ohne Dauer = permanent.
# Aufheben: /unban, /unmute, /unbanip; Verlauf: /history <spieler>; Admin-Panel → Moderation → Strafen.
# Platzhalter: <id>, <type>, <verb>, <target>, <reason>, <actor>, <duration>, <remaining>, <date>, <expires>
# ------------------------------------------------------------
punishments:
  broadcast: false              # true = Bans/Mutes auch allen Spielern ansagen (IP-Bans nie)
  # Befehle, die gemutete Spieler nicht nutzen dürfen
  mute-blocked-commands: [msg, tell, w, whisper, r, reply, me, say]
  # Vorgefertigte Strafen: type ban|mute|ipban, duration z.B. 7d oder permanent
  templates:
    "1": { type: ban, duration: 30d, reason: "Hacking / unerlaubte Clients" }
    "2": { type: ban, duration: 7d, reason: "Griefing" }
    "3": { type: mute, duration: 1h, reason: "Beleidigung" }
    "4": { type: mute, duration: 1d, reason: "Spam" }
    "5": { type: ban, duration: 3d, reason: "Ausnutzen von Bugs" }
    "6": { type: ban, duration: permanent, reason: "Schwerer Regelverstoß" }
    "7": { type: ipban, duration: permanent, reason: "Ban-Umgehung" }
    "8": { type: ban, duration: 1d, reason: "Wiederholt unfaires Verhalten (Fairplay)" }

# ------------------------------------------------------------
# ItemGuard – entfernt nicht survival-taugliche Items und meldet den Spieler (Report, Absender "ItemGuard").
# Scan beim Join und alle interval-seconds; /itemscan [spieler] (Alias /iscan) scannt sofort.
# Spieler mit sess.itemguard.bypass werden nicht gescannt. Einstellbar auch im Admin-Panel (Moderation → ItemGuard).
# Platzhalter: <items>, <target>, <id> (Report-Nummer)
# ------------------------------------------------------------
itemguard:
  enabled: true
  interval-seconds: 15
  block-spawn-eggs: true      # alle Spawn-Eier entfernen und das Benutzen blockieren
  scan-enderchest: true
  scan-shulkers: true         # Shulkerkisten in Inventar und Enderchest durchsuchen
  banned:
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - COMMAND_BLOCK_MINECART
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW
    - BARRIER
    - SPAWNER
    - DEBUG_STICK
    - KNOWLEDGE_BOOK
    - BEDROCK
    - END_PORTAL_FRAME
    - LIGHT
    - REINFORCED_DEEPSLATE
    - PETRIFIED_OAK_SLAB
    - PLAYER_HEAD

# ------------------------------------------------------------
# CreativeLog – protokolliert alle Aktionen von Spielern im Kreativmodus (außer mit sess.creativelog.bypass):
# Moduswechsel, Join/Quit, Items aus dem Kreativ-Inventar, Container, Droppen/Aufheben, Blöcke, Rechtsklicks,
# Schaden, Befehle. Abruf: /creativelog <spieler> [seite] (Alias /clog) oder Admin-Panel → Moderation → CreativeLog.
# Platzhalter: <target>, <page>, <pages>, <prev>, <next>
# ------------------------------------------------------------
creativelog:
  enabled: true
  max-entries: 1000     # pro Spieler; ältere Einträge fallen weg
  page-size: 15

# ------------------------------------------------------------
# Trust – neue Spieler können nicht mit der Welt interagieren (Blöcke, Container, Türen, Entities, Eimer),
# bis genug Spieler mit /trust <spieler> für sie gestimmt haben.
# Beim ersten Start gelten alle Spieler, die schon einmal online waren, als vertraut.
# Admins: /trust add|remove <spieler> (sess.trust.admin). Immer vertraut: sess.trust.bypass.
# Platzhalter: <target>, <votes>, <needed>, <voter>, <time> (playtime-left: fehlende Spielzeit, suspect-banned: Ban-Dauer)
# ------------------------------------------------------------
trust:
  # Wer abstimmen darf: "trusted" = alle vertrauten Spieler, "permission" = nur Spieler mit sess.trust.vote
  voters: trusted
  # Stimmen, ab denen ein Spieler vertraut ist
  votes-needed: 3
  # true = betritt ein neuer Spieler den Server, startet automatisch eine Abstimmung:
  # alle, die abstimmen dürfen, bekommen eine Nachricht mit Klick-Button. false = nur per /trust <spieler>
  auto-vote: true
  # Spielzeit, ab der Spielern automatisch vertraut wird, z.B. 30m, 5h, 1d – 0 = aus.
  # Zählt die Spielzeit aus der Minecraft-Statistik (auch vor dem Einschalten); geprüft beim Join und jede Minute.
  auto-trust-playtime: 0
  # Verdachts-Abstimmung: /suspect <spieler> (Alias /verdacht) gegen einen Online-Spieler.
  # Abstimmen darf, wer auch für Vertrauen stimmen darf (voters). Bei genug Stimmen innerhalb von votes-expire
  # wird der Spieler über das Strafen-System gebannt (braucht das Modul punishments).
  # Nie betroffen: sess.punish.exempt und sess.trust.bypass. Stimmen werden in suspicion.yml gespeichert.
  suspicion:
    enabled: false
    votes-needed: 3
    votes-expire: 30m      # Stimmen, die älter sind, zählen nicht mehr
    ban-duration: 1d       # z.B. 30m, 12h, 3d
    reason: "Verdacht (Abstimmung der Spieler)"

# ------------------------------------------------------------
# Client-Detector
# Erkennt beim Join den Client über Brand und Plugin-Channels.
# Hack-Clients nur über Signaturen – getarnte Clients (Brand "vanilla"/"fabric") fallen nicht auf.
# Wer was gemeldet bekommt, stellt jeder Admin im Admin-Panel unter "Benachrichtigungen" ein.
# Platzhalter: <client>, <channels>, <match>, <id> (Meldung im Admin-Panel)
# ------------------------------------------------------------
client-detector:
  enabled: true
  # Wartezeit nach dem Join in Ticks (20 = 1 Sekunde), bis alle Channels registriert sind
  check-delay-ticks: 40
  # true = auch für Mod-Clients (Fabric, Forge, Lunar, ...) eine Meldung im Admin-Panel anlegen
  report-modded: false
  # Treffer = Hack-Client. Geprüft wird, ob Brand oder ein Channel den Text enthält (Groß-/Kleinschreibung egal).
  hack-signatures:
    - wurst
    - meteor
    - aristois
    - liquidbounce
    - rusherhack
    - futureclient
    - inertia
    - konas
    - salhack
    - bleachhack
    - thunderhack
    - phobos
    - 3arthh4ck

# ------------------------------------------------------------
# TAB-Liste
# ------------------------------------------------------------
tab:
  enabled: true
  update-interval-ticks: 40
  header:
    - ""
    - "<gradient:#00c6ff:#0072ff><bold>MEIN SERVER</bold></gradient>"
    - "<gray>Online: <white><online></white>/<white><max_players></white>"
    - ""
  footer:
    - ""
    - "<gray>Viel Spaß, <white><player></white>!"
    - ""
  # Anzeige des Spielers in der TAB-Liste.
  # Leer lassen (""), damit Prefix/Suffix aus "nametag" auch im TAB genutzt werden.
  player-format: "<lp_prefix><player><lp_suffix>"

# ------------------------------------------------------------
# Nametags (über dem Kopf, nutzt Scoreboard-Teams)
# Die Teams sortieren die TAB-Liste: kleinere priority = weiter oben.
# ------------------------------------------------------------
nametag:
  enabled: true
  default:
    priority: 99
    prefix: "<lp_prefix>"
    suffix: "<lp_suffix>"
    name-color: white     # Farbe des Namens (Vanilla-Farbname)
  groups:
    admin:
      priority: 1
      prefix: "<red>[Admin] "
      suffix: ""
      name-color: red
    # vip:
    #   priority: 10
    #   prefix: "<gold>[VIP] "
    #   suffix: " <yellow>★"
    #   name-color: gold

# ------------------------------------------------------------
# Item-Upgrader (/upgrader, Alias /upgrade – Recht sess.upgrader)
# Ein Item aus dem Inventar setzen, ein wertvolleres Ziel wählen und drehen: Gewinn = Ziel-Item,
# Verlust = Einsatz weg. Chance = house-factor × Einsatzwert / Zielwert, begrenzt auf min/max-chance.
# Item-Werte: Grundwerte für Rohstoffe sind im Plugin hinterlegt (Erde 1, Eisen 40, Gold 60, Diamant 400,
# Netherstern 4000), alles andere wird aus den Rezepten berechnet. Beschädigte Items zählen anteilig.
# Umbenannte Items, Plugin-Items und gefüllte Behälter (Shulker, Bündel) können nicht gesetzt werden.
# Verwalten: /upgrader admin bzw. Admin-Panel (Wirtschaft → Item-Upgrader); Wert eines Items: /upgrader value [item]
# Platzhalter: <item>, <amount>, <chance>, <value>, <total>
# ------------------------------------------------------------
upgrader:
  house-factor: 0.9
  min-chance: 0.001         # 0,1 %
  max-chance: 0.9           # 90 %
  # Items, die weder gesetzt noch gewonnen werden können
  blacklist:
    - SPAWNER
    - TRIAL_SPAWNER
    - VAULT
    - DRAGON_EGG
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - BEDROCK
    - BARRIER
  # Eigene Werte pro Item, z.B. ELYTRA: 5000 (gehen den Grundwerten und Rezepten vor)
  value-overrides: {}
  # Getrennte Werte als Einsatz (beim Setzen) bzw. als Gewinn (als Ziel) – überschreiben den Wert nur für diese
  # Seite und wirken nicht auf Rezepte. Bequem im Admin-Panel unter „Upgrader-Werte“. Beispiel:
  #   input-overrides: {ELYTRA: 3000}    → wer eine Elytra setzt, setzt 3000
  #   output-overrides: {ELYTRA: 8000}   → eine Elytra zu gewinnen kostet Chance wie 8000
  input-overrides: {}
  output-overrides: {}

# ------------------------------------------------------------
# Auto-Update aus GitHub-Releases (vom Build-Workflow bei einem Tag wie v1.2.3 veröffentlicht).
# Prüft täglich zur Uhrzeit, ob es ein neueres Release gibt, lädt das Jar, prüft SHA-256 und plugin.yml
# und legt es in den Update-Ordner (plugins/update) – aktiv nach dem nächsten Neustart.
# An/aus: /autoupdate an|aus oder Admin-Panel (Server → Auto-Update). Sofort prüfen: /autoupdate check
# Platzhalter: <version>, <current>, <error>, <repository>, <state>, <time>, <result>
# ------------------------------------------------------------
auto-update:
  enabled: false
  repository: mauricebrn/SEssentials   # besitzer/repo auf GitHub
  time: "04:00"                        # tägliche Prüfung, Serverzeit (HH:mm, in Anführungszeichen)
  token: ""                            # nur für private Repos: GitHub-Token mit Lesezugriff auf Inhalte
  restart-minutes: 0                   # > 0 = nach einem Update Softrestart in X Minuten starten

# ------------------------------------------------------------
# Fake-Spieler (/fakeplayer, Aliase /fp, /bot – Recht sess.fakeplayer)
# Echte Spieler ohne Client: online im TAB und in /list, laden Chunks wie ein Spieler (Pflanzen wachsen,
# Mobs spawnen) und sind Ziel aller Befehle (/msg, /mail, /ban, /tp, /give, …). Inventar und Position
# speichert der Server wie bei jedem Spieler.
#   /fp create <name> [skin]   an deiner Position erstellen (Skin = Spielername, Standard: der Name)
#   /fp join|leave <name>      beitreten / verlassen (bleibt erhalten); nach Kick oder Ban offline bis /fp join
#   /fp remove <name>          endgültig entfernen
#   /fp tp|tphere|equip|inv <name>   hinreisen, herholen (setzt den Heimatpunkt), deine Ausrüstung kopieren, Inventar öffnen
#   /fp ai <name> on|off       KI ein/aus
#   /fp goal <name> wander|mobs|players|all   Angriff: nur herumlaufen bzw. Mobs / Spieler / beides von sich aus bekämpfen
#   /fp goal <name> mine <block>              einen Blocktyp abbauen, z.B. mine diamond_ore: sucht freiliegende
#                                             Blöcke um den Heimatpunkt, baut sie mit dem Werkzeug in der Hand ab
#                                             und sammelt die Drops ein (Schutz-Plugins greifen wie bei Spielern)
#   /fp defense <name> flee|fight|ignore      Verteidigung, wenn ihn ein Spieler oder Mob trifft: weglaufen,
#                                             zurückschlagen (bei wenig Leben doch weglaufen) oder nichts tun
#   /fp skin <name> <skin>     /fp list
#   /fp animate <name>         den Fake-Spieler selbst steuern: du wirst unsichtbar und "verlässt" den Server
#                              (Leave-Nachricht), er übernimmt deine Bewegungen, Armschwünge und deinen Chat.
#                              Deine Befehle (außer /fp) führt er aus – mit deinen Rechten, die er dafür erbt
#                              (bei OP vorübergehend OP) – und du bekommst die Ausgabe.
#                              Nochmal bzw. /fp animate beendet es (Join-Nachricht für dich). War er offline,
#                              tritt er dafür bei und verlässt den Server danach wieder.
# Kämpfende Fake-Spieler greifen nur echte Spieler im Überlebens-/Abenteuermodus an, nicht im Vanish und
# nicht mit sess.fakeplayer.ignore. Nach dem Tod erscheinen sie nach respawn-seconds am Heimatpunkt.
# Tritt ein echter Spieler mit demselben Namen bei, verlässt der Fake-Spieler den Server.
# Platzhalter: <name>, <skin>, <goal>, <defense>, <count>, <state>, <location>
# ------------------------------------------------------------
fakeplayers:
  max: 20
  respawn-seconds: 5
  wander-radius: 12            # Blöcke um den Heimatpunkt
  aggro-range: 16              # Suchradius für Gegner
  attack-cooldown-ticks: 12    # 20 Ticks = 1 Sekunde
  # Startwerte für neu erstellte Fake-Spieler (danach mit /fp ai, /fp goal, /fp defense änderbar)
  defaults:
    ai: false
    goal: wander               # wander, mobs, players, all
    defense: flee              # flee, fight, ignore
  mining:
    radius: 16                 # Blöcke um den Heimatpunkt (nach oben/unten die Hälfte)
  defense:
    flee-distance: 16          # so weit (Blöcke) läuft er vor dem Angreifer weg
    flee-seconds: 10           # höchstens so lange
    flee-below-health: 6       # bei "fight": unter so viel Leben (2 = 1 Herz) doch weglaufen; 0 = nie
  animate:
    announce: true             # beim Animieren Leave-/Join-Nachricht für dich senden
