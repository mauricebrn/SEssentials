<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glücksrad – SEssentials Webpanel</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/gambling.js" defer></script>
</head>
<body>
  <header class="top">
    <div>
      <h1>SEssentials Webpanel</h1>
      <nav class="nav"><a href="/">Dashboard</a><a href="/gambling" class="active">Glücksrad</a><a href="/creativelog" id="nav-creativelog" hidden>CreativeLog</a></nav>
      <p class="muted" id="meta">Lade Daten …</p>
    </div>
    <a class="button" href="/logout">Abmelden</a>
  </header>
  <main>
    <section class="kpis" id="kpis"></section>

    <section class="grid">
      <article class="card wide">
        <h2>Einsätze und Auszahlungen (30 Tage)</h2>
        <div class="legend"><span class="key key-staked">Eingesetzt</span><span class="key key-paid">Ausgezahlt</span></div>
        <div id="chart" class="chart"></div>
      </article>

      <article class="card">
        <h2>Felder: Chance und Treffer</h2>
        <div id="segments"></div>
      </article>
      <article class="card">
        <h2>Aktivste Spieler</h2>
        <div id="players"></div>
      </article>

      <article class="card wide">
        <h2>Letzte Drehungen</h2>
        <div id="recent"></div>
      </article>
    </section>
  </main>
</body>
</html>
