name: SEssentials
version: '${project.version}'
main: de.sessentials.SEssentials
api-version: '26.2'
description: Softrestart, Chatformat, TAB, Nametags, Join/Leave, Vanish und Spieler-Befehle mit MiniMessage & LuckPerms
author: Moritz
softdepend: [LuckPerms, PlaceholderAPI, Vault]

permissions:
  sess.softrestart:
    description: Erlaubt /softrestart
    default: op
  sess.reload:
    description: Erlaubt /sessentials reload
    default: op
  sess.fakeplayer:
    description: Erlaubt /fakeplayer (Fake-Spieler erstellen, steuern, entfernen)
    default: op
  sess.fakeplayer.ignore:
    description: Wird von kämpfenden Fake-Spielern nicht angegriffen
    default: false
  sess.upgrader:
    description: Erlaubt /upgrader (Item-Upgrader)
    default: true
  sess.upgrader.admin:
    description: Erlaubt /upgrader admin (Item-Werte und Sperrliste verwalten)
    default: op
  sess.update:
    description: Erlaubt /autoupdate und das Auto-Update im Admin-Panel; bekommt Update-Meldungen
    default: op
  sess.admin:
    description: Erlaubt /admin (Admin-Panel)
    default: op
  sess.report:
    description: Erlaubt /report
    default: true
  sess.report.notify:
    description: Bekommt eine Benachrichtigung bei neuen Reports
    default: op
  sess.report.bypasscooldown:
    description: Ignoriert den Cooldown von /report
    default: op
  sess.detector.notify:
    description: Bekommt Meldungen vom Client-Detector (einstellbar im Admin-Panel)
    default: op
  sess.reports.admin:
    description: Erlaubt /reports und /clearreports
    default: op
  sess.vanish:
    description: Erlaubt /vanish
    default: op
  sess.vanish.auto:
    description: Beim Joinen automatisch unsichtbar
    default: false
  sess.vanish.bypass:
    description: Erlaubt /vanish bypass (Schutzregeln im Vanish aufheben)
    default: op
  sess.vanish.see:
    description: Sieht versteckte Spieler
    default: op
  sess.fly:
    description: Erlaubt /fly
    default: op
  sess.fly.others:
    description: Erlaubt /fly <spieler>
    default: op
  sess.heal:
    description: Erlaubt /heal
    default: op
  sess.heal.others:
    description: Erlaubt /heal <spieler>
    default: op
  sess.feed:
    description: Erlaubt /feed
    default: op
  sess.feed.others:
    description: Erlaubt /feed <spieler>
    default: op
  sess.god:
    description: Erlaubt /god
    default: op
  sess.god.others:
    description: Erlaubt /god <spieler>
    default: op
  sess.sudo:
    description: Erlaubt /sudo (Spieler einen Befehl ausführen oder chatten lassen)
    default: op
  sess.sudo.exempt:
    description: Kann von anderen Spielern nicht per /sudo gesteuert werden (von der Konsole schon)
    default: op
  sess.nether:
    description: Erlaubt /nether
    default: op
  sess.end:
    description: Erlaubt /end
    default: op
  sess.spawn:
    description: /spawn ohne Kosten
    default: op
  sess.setspawn:
    description: Erlaubt /setspawn
    default: op
  sess.tpa:
    description: Erlaubt /tpa
    default: true
  sess.tpa.free:
    description: /tpa ohne Kosten
    default: op
  sess.news.admin:
    description: Erlaubt /newsadmin (News verwalten) und das Lesen unveröffentlichter News
    default: op
  sess.bank:
    description: Erlaubt /bank (Einzahlen, Auszahlen)
    default: true
  sess.bank.pay:
    description: Erlaubt /pay
    default: true
  sess.bounty:
    description: Erlaubt /kopfgeld (Kopfgeld aussetzen und anzeigen)
    default: true
  sess.teleport.nowarmup:
    description: Teleportiert ohne Wartezeit (/spawn, /tpa, /nether, /end, /clan home)
    default: op
  sess.clan:
    description: Erlaubt /clan (gründen, beitreten, Home, Truhe, Clan-Konto)
    default: true
  sess.clan.admin:
    description: Erlaubt /clan admin aufloesen, die Clan-Verwaltung im Admin-Panel und das Abbauen fremder Clan-Truhen
    default: op
  sess.bounty.admin:
    description: Erlaubt /kopfgeld entfernen und die Kopfgeld-Verwaltung im Admin-Panel
    default: op
  sess.bank.admin:
    description: Erlaubt /eco und die Konten-Verwaltung im Admin-Panel
    default: op
  sess.itemguard.bypass:
    description: Wird vom ItemGuard nicht gescannt
    default: op
  sess.itemguard.scan:
    description: Erlaubt /itemscan
    default: op
  sess.itemguard.admin:
    description: ItemGuard im Admin-Panel einstellen
    default: op
  sess.trust:
    description: Erlaubt /trust (eigenen Status sehen, für neue Spieler stimmen)
    default: true
  sess.trust.vote:
    description: Darf für neue Spieler stimmen, wenn trust.voters auf permission steht
    default: op
  sess.trust.admin:
    description: Erlaubt /trust add|remove (Vertrauen direkt setzen oder entziehen)
    default: op
  sess.trust.bypass:
    description: Gilt immer als vertraut
    default: op
  sess.creativelog.view:
    description: Erlaubt /creativelog und die Ansicht im Admin-Panel
    default: op
  sess.creativelog.bypass:
    description: Wird im Kreativmodus nicht protokolliert
    default: false
  sess.fairplay:
    description: Erlaubt /fairplay (eigene Punkte, andere Spieler, Rangliste)
    default: true
  sess.fairplay.admin:
    description: Erlaubt /fairplay reset, die Fairplay-Verwaltung im Admin-Panel und zeigt den Verstoß-Verlauf in /fairplay <spieler>
    default: op
  sess.fairplay.notify:
    description: Bekommt Meldungen über Fairplay-Verstöße und Strikes
    default: op
  sess.fairplay.exempt:
    description: Bekommt keine Fairplay-Verstöße
    default: false
  sess.punish.ban:
    description: /ban, /unban und Ban-Vorlagen
    default: op
  sess.punish.mute:
    description: /mute, /unmute und Mute-Vorlagen
    default: op
  sess.punish.ipban:
    description: /ipban, /unbanip und IP-Ban-Vorlagen
    default: op
  sess.punish.history:
    description: /history und Strafen im Admin-Panel
    default: op
  sess.punish.notify:
    description: Benachrichtigung bei neuen und aufgehobenen Strafen
    default: op
  sess.punish.exempt:
    description: Kann von Spielern nicht bestraft werden (Konsole schon)
    default: op
  sess.webpanel:
    description: Erlaubt /webpanel (Login-Link für das Webpanel)
    default: op
  sess.tracker:
    description: Item-Tracker im Admin-Panel
    default: op
  sess.enderchest:
    description: Erlaubt /enderchest (/ec)
    default: true
  sess.enderchest.free:
    description: /enderchest ohne Kosten
    default: op
  sess.gamble:
    description: Erlaubt /gluecksrad
    default: true
  sess.gamble.admin:
    description: Erlaubt /gluecksrad topf setzen, das Glücksrad im Admin-Panel und Chancen pro Spieler im Webpanel
    default: op
  sess.chestshop.create:
    description: Chestshops erstellen
    default: true
  sess.chestshop.admin:
    description: Admin-Shops erstellen, alle Shops öffnen und abbauen
    default: op
  sess.msg:
    description: Erlaubt /msg und /r
    default: true
  sess.spy:
    description: Erlaubt /socialspy – private Nachrichten (/msg, /r, /mail) mitlesen
    default: op
  sess.mail:
    description: Erlaubt /mail (Nachrichten an offline Spieler)
    default: true
  sess.chat.color:
    description: Erlaubt &-Farbcodes in Chatnachrichten
    default: op
  sess.chat.minimessage:
    description: Erlaubt MiniMessage-Tags in Chatnachrichten
    default: op
